<!doctype html>
<!--
  IDENTIDADE VISUAL · "Catálogo técnico de peças"
  Motivo: prancha de catálogo de peças / desenho de engenharia — vista explodida de pistão, anéis, pino, biela, vela e
  engrenagem em traço fino, com linhas de centro, linhas de chamada e balões numerados; grade milimetrada azul no fundo.
  Cores: papel claro, azul da marca #002C8F em todos os traços; vermelho #E92525 só em marcações (Detalhe A, nº das fichas);
  verde só no botão do WhatsApp. Tipografia: Archivo (condensada nos títulos, normal no texto) + IBM Plex Mono nos rótulos.
  Ícones próprios em traço técnico de 1,6 px. Detalhe memorável: cada loja é uma "ficha técnica" numerada (01, 02) e os
  demais botões seguem a numeração do catálogo (03, 04, 05), como itens de uma lista de peças.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AD Motos</title>
<meta name="description" content="Peças e acessórios para motos em Capim Grosso, Senhor do Bonfim e Várzea da Roça (BA). Fale com a loja pelo WhatsApp.">
<meta name="theme-color" content="#F5F7FC">
<meta property="og:type" content="website">
<meta property="og:title" content="AD Motos">
<meta property="og:description" content="Peças e acessórios para motos. Fale com a gente no WhatsApp.">
<meta property="og:image" content="https://helyanaraujo.github.io/admotos-links/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  --azul: #002C8F; --azul-2: #1A47B0; --azul-claro: #EEF2FB; --azul-linha: #C7D2EA;
  --vermelho: #E92525;
  --verde: #137F42; --verde-2: #0F6B37;
  --papel: #F5F7FC; --branco: #FFFFFF;
  --texto: #0B1B3F; --texto-2: #46536F; --texto-3: #64708A;
  --grade-fina: rgba(0, 44, 143, .045); --grade-forte: rgba(0, 44, 143, .085);
  --f: "Archivo", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --m: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --raio: 6px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
html { background: var(--papel); }
body {
  min-height: 100vh; min-height: 100dvh; color: var(--texto);
  font: 16px/1.45 var(--f); -webkit-font-smoothing: antialiased; overflow-x: hidden;
  /* grade milimetrada: linha fina a cada 8 px, linha forte a cada 40 px */
  background-color: var(--papel);
  background-image:
    linear-gradient(var(--grade-forte) 1px, transparent 1px),
    linear-gradient(90deg, var(--grade-forte) 1px, transparent 1px),
    linear-gradient(var(--grade-fina) 1px, transparent 1px),
    linear-gradient(90deg, var(--grade-fina) 1px, transparent 1px);
  background-size: 40px 40px, 40px 40px, 8px 8px, 8px 8px;
  background-position: -1px -1px;
}
img { display: block; }
.rotulo { font: 600 11px/1.2 var(--m); letter-spacing: .08em; text-transform: uppercase; color: var(--texto-3); }

.pagina {
  width: 100%; max-width: 560px; margin: 0 auto;
  padding:
    calc(18px + env(safe-area-inset-top))
    calc(16px + env(safe-area-inset-right))
    calc(28px + env(safe-area-inset-bottom))
    calc(16px + env(safe-area-inset-left));
}

/* ---------- Cabeçalho ---------- */
.cab { display: flex; flex-direction: column; align-items: center; text-align: center; }
.cab .logo { width: 212px; height: auto; }
.cab h1 {
  margin: 10px 0 0; font-weight: 600; font-size: 17px; line-height: 1.25; font-stretch: 100%;
  color: var(--texto-2); letter-spacing: .005em;
}

/* ---------- Prancha (ilustração) ---------- */
.prancha {
  position: relative; margin: 16px 0 0; background: rgba(255, 255, 255, .72);
  border: 1px solid var(--azul-linha); border-radius: 2px;
  padding: 0 12px 12px;
}
/* marcas de canto, como numa folha de desenho */
.prancha::before, .prancha::after {
  content: ""; position: absolute; width: 10px; height: 10px; pointer-events: none;
  border-color: var(--azul); border-style: solid;
}
.prancha::before { top: -4px; left: -4px; border-width: 1.5px 0 0 1.5px; }
.prancha::after { bottom: -4px; right: -4px; border-width: 0 1.5px 1.5px 0; }
.prancha-cab {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  margin: 0 -12px; padding: 8px 12px; border-bottom: 1px solid var(--azul-linha);
}
.prancha-cab .rotulo:first-child { color: var(--azul); }
.desenho { display: block; width: 100%; height: auto; margin: 4px 0 0; }
.desenho .t { fill: none; stroke: var(--azul); stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; }
.desenho .p { fill: #fff; }
.desenho .fino { stroke-width: .7; }
.desenho .centro { fill: none; stroke: var(--azul); stroke-width: .55; stroke-dasharray: 9 2.5 1.5 2.5; opacity: .7; }
.desenho .oculto { stroke-dasharray: 2.5 2; stroke-width: .7; }
.desenho .chamada { fill: none; stroke: var(--azul); stroke-width: .6; }
.desenho .ponto { fill: var(--azul); }
.desenho .balao circle { fill: #fff; stroke: var(--azul); stroke-width: .9; }
.desenho .balao text { font: 600 8.6px var(--m); fill: var(--azul); text-anchor: middle; dominant-baseline: central; }
.desenho .destaque { fill: none; stroke: var(--vermelho); stroke-width: .95; stroke-dasharray: 3 2; }
.desenho .destaque-txt { font: 600 8.6px var(--m); fill: var(--vermelho); letter-spacing: .04em; }

.legenda {
  list-style: none; margin: 0; padding: 9px 0 0; border-top: 1px dashed var(--azul-linha);
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px 8px;
}
.legenda li { display: flex; align-items: center; gap: 7px; font: 500 11.5px/1.2 var(--m); color: var(--texto-2); min-width: 0; }
.legenda b {
  flex: none; width: 18px; height: 18px; border: 1px solid var(--azul); border-radius: 50%;
  display: grid; place-items: center; font: 600 10px/1 var(--m); color: var(--azul);
}

/* ---------- Seções ---------- */
.secao { margin-top: 24px; }
.secao-cab { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
.secao-cab h2 { margin: 0; font: 600 11.5px/1.2 var(--m); letter-spacing: .1em; text-transform: uppercase; color: var(--azul); }
.secao-cab::after { content: ""; flex: 1; height: 1px; background: var(--azul-linha); }

/* ---------- Fichas técnicas das lojas ---------- */
.fichas { display: grid; gap: 14px; }
.ficha {
  background: var(--branco); border: 1px solid var(--azul-linha); border-radius: var(--raio);
  box-shadow: 0 1px 2px rgba(11, 27, 63, .04), 0 10px 24px -16px rgba(11, 27, 63, .22);
  overflow: hidden;
}
.ficha-topo {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 16px; background: var(--azul-claro); border-bottom: 1px solid var(--azul-linha);
}
.ficha-num { display: flex; align-items: center; gap: 9px; }
.ficha-num b {
  width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--vermelho);
  display: grid; place-items: center; font: 600 10.5px/1 var(--m); color: var(--vermelho); background: #fff;
}
.ficha-num .rotulo { color: var(--azul); }
.tipo {
  font: 600 10.5px/1 var(--m); letter-spacing: .1em; text-transform: uppercase;
  color: var(--azul); border: 1px solid var(--azul); border-radius: 3px; padding: 5px 7px 4px;
}
.tipo.matriz { background: var(--azul); color: #fff; }
.ficha-corpo { padding: 14px 16px 16px; }
.ficha h3 {
  margin: 0; font-weight: 750; font-size: 30px; line-height: 1.05; font-stretch: 78%;
  letter-spacing: -.005em; color: var(--texto); text-transform: none;
}
.end { margin: 7px 0 14px; display: flex; align-items: flex-start; gap: 7px; font-size: 15.5px; line-height: 1.35; color: var(--texto-2); }
.end svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--azul); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.zap {
  display: flex; align-items: center; gap: 14px; min-height: 62px; padding: 10px 16px 10px 14px;
  border-radius: var(--raio); background: var(--verde); color: #fff; text-decoration: none;
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .14);
}
.zap:hover { background: var(--verde-2); }
.zap:active { background: var(--verde-2); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .2); }
.zap .zico { flex: none; width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, .16); display: grid; place-items: center; }
.zap .zico svg { width: 22px; height: 22px; }
.zap .ztxt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.zap strong { font-weight: 700; font-size: 18.5px; line-height: 1.15; letter-spacing: .005em; }
.zap small { font: 500 13px/1.3 var(--m); opacity: .92; margin-top: 2px; }
.zap .seta { flex: none; width: 20px; height: 20px; }

.acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.sec {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 8px 10px;
  border: 1px solid var(--azul-linha); border-radius: var(--raio); background: #fff;
  font: 600 15px/1.2 var(--f); color: var(--azul); text-decoration: none; cursor: pointer; text-align: center;
}
.sec:hover { border-color: var(--azul); background: var(--azul-claro); }
.sec:active { background: #E2E9F8; }
.sec .sic { flex: none; display: grid; }
.sec svg { width: 19px; height: 19px; }
.sec.ok { color: var(--verde); border-color: var(--verde); }

/* ---------- Lista de outros itens ---------- */
.lista {
  list-style: none; margin: 0; padding: 0; background: #fff;
  border: 1px solid var(--azul-linha); border-radius: var(--raio); overflow: hidden;
}
.lista li + li { border-top: 1px solid #E4E9F4; }
.item {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 11px 16px;
  background: none; border: 0; font: inherit; color: inherit; text-align: left; text-decoration: none; cursor: pointer;
}
.item:hover { background: #F6F8FD; }
.item:active { background: var(--azul-claro); }
.item .pos { flex: none; width: 22px; font: 600 11px/1 var(--m); color: var(--texto-3); letter-spacing: .04em; }
.item .ic {
  flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--azul-linha);
  display: grid; place-items: center; color: var(--azul);
}
.item .ic svg { width: 19px; height: 19px; }
.item .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.item strong { font-weight: 650; font-size: 16.5px; line-height: 1.2; color: var(--texto); }
.item small { font-size: 13.5px; line-height: 1.3; color: var(--texto-3); overflow-wrap: anywhere; }
.item .seta { flex: none; width: 18px; height: 18px; color: #9AA6C0; }
.item.ok .ic { color: var(--verde); border-color: var(--verde); }
.item.ok small { color: var(--verde); }

/* ---------- Rodapé ---------- */
.rodape {
  margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--azul-linha);
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
}
.rodape img { width: 26px; height: auto; }
.rodape .marca { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; color: var(--texto-2); }

/* ---------- Foco e aviso ---------- */
a:focus-visible, button:focus-visible { outline: 2.5px solid var(--azul); outline-offset: 3px; border-radius: var(--raio); }
.zap:focus-visible { outline-color: var(--texto); }
.aviso {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  max-width: calc(100% - 32px); display: flex; align-items: center; gap: 10px;
  padding: 11px 16px; border-radius: var(--raio); background: var(--texto); color: #fff;
  font: 500 14px/1.3 var(--f); box-shadow: 0 12px 30px -10px rgba(11, 27, 63, .5);
  visibility: hidden; opacity: 0; z-index: 10;
}
.aviso.mostra { visibility: visible; opacity: 1; }
.aviso svg { flex: none; width: 18px; height: 18px; color: #6EE7A0; }
.aviso.erro svg { color: #FFB4B4; }

/* ---------- Animação de abertura (só com JS e sem "reduzir movimento") ----------
   A classe .anima é posta pelo script; sem ela (ou com prefers-reduced-motion) o desenho já aparece pronto.
   Só a ilustração anima: fichas e botões ficam parados e clicáveis desde o início. */
@media (prefers-reduced-motion: no-preference) {
  .desenho.anima .pc { animation: encaixe .95s cubic-bezier(.22, .7, .18, 1) var(--d, 0s) both; }
  .desenho.anima .chamada { stroke-dasharray: 1; animation: traco .38s ease-out both; animation-delay: .78s; }
  .desenho.anima .ponto, .desenho.anima .bl { transform-box: fill-box; transform-origin: center; }
  .desenho.anima .ponto { animation: surge .25s ease-out .74s both; }
  .desenho.anima .bl { animation: surge .32s cubic-bezier(.3, 1.3, .5, 1) var(--d) both; }
  .desenho.anima .det { transform-box: fill-box; transform-origin: 62% 62%; animation: marca .5s cubic-bezier(.22, .7, .18, 1) 1.25s both; }
}
@keyframes encaixe { from { transform: translate(var(--dx), var(--dy)); opacity: .35; } to { transform: none; opacity: 1; } }
@keyframes traco { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes surge { from { transform: scale(.55); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes marca { from { transform: scale(1.35); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Computador ---------- */
@media (min-width: 1000px) {
  .pagina {
    max-width: 1140px; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    column-gap: 56px; align-items: start; padding-top: 48px; padding-bottom: 48px;
  }
  .lado-a { position: sticky; top: 40px; }
  .cab { align-items: flex-start; text-align: left; }
  .cab .logo { width: 260px; }
  .cab h1 { font-size: 19px; }
  .prancha { margin-top: 26px; padding: 0 22px 18px; }
  .prancha-cab { margin: 0 -22px; padding: 10px 22px; }
  .desenho { margin: 14px 0 8px; }
  .legenda li { font-size: 12.5px; }
  .lado-b > .secao:first-child { margin-top: 0; }
  .rodape { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div class="pagina">
  <div class="lado-a">
    <header class="cab">
      <img class="logo" src="logo.svg" alt="AD Motos" width="212" height="66">
      <h1>Peças e acessórios para motos</h1>
    </header>

    <figure class="prancha" aria-label="Ilustração técnica: vista explodida de peças de motor de moto">
      <figcaption class="prancha-cab">
        <span class="rotulo">Fig. 1</span>
        <span class="rotulo">Vista explodida</span>
      </figcaption>

      <svg class="desenho" viewBox="0 0 360 240" role="img" aria-label="Vela de ignição, anéis, pistão, pino, biela e engrenagem em vista explodida">
        <!-- linhas de centro -->
        <path class="centro" d="M160 6V236"/>
        <path class="centro" d="M46 104V194"/>
        <path class="centro" d="M207 135L262 166.8"/>
        <path class="centro" d="M266 200H346M306 160V240"/>

        <!-- 1 · vela de ignição -->
        <g class="pc" style="--dx:-16px;--dy:0px;--d:0s"><g transform="translate(0 52)">
          <rect class="t p" x="42" y="10" width="8" height="12" rx="1.5"/>
          <path class="t fino" d="M42 15.5H50"/>
          <rect class="t p" x="39" y="22" width="14" height="44" rx="2"/>
          <path class="t fino" d="M37.5 29H54.5M37.5 35H54.5M37.5 41H54.5M37.5 47H54.5"/>
          <path class="t fino" d="M39 29.5h-1.5v-1h1.5M53 29.5h1.5v-1H53"/>
          <rect class="t p" x="31" y="66" width="30" height="18" rx="1.2"/>
          <path class="t fino" d="M39 66V84M53 66V84"/>
          <rect class="t p" x="33" y="84" width="26" height="4"/>
          <rect class="t p" x="37" y="88" width="18" height="30"/>
          <path class="t fino" d="M37 93L55 90M37 98L55 95M37 103L55 100M37 108L55 105M37 113L55 110M37 118L55 115"/>
          <rect class="t p" x="43" y="118" width="6" height="6"/>
          <path class="t" d="M46 124V129"/>
          <path class="t" stroke-width="1.6" d="M53 118V132H47"/>
        </g></g>

        <!-- 2 · anéis (com a abertura na frente) -->
        <g class="pc" style="--dx:0px;--dy:-16px;--d:.06s">
          <path class="t p" d="M114 26V29A46 8 0 0 0 156 36.97V33.97A46 8 0 0 1 114 26ZM164 33.97V36.97A46 8 0 0 0 206 29V26A46 8 0 0 1 164 33.97Z"/>
          <path class="t" d="M156 33.97A46 8 0 1 1 164 33.97"/>
          <path class="t fino" d="M157 32.18A40 6.2 0 1 1 163 32.18"/>
          <path class="t p" d="M114 42V45A46 8 0 0 0 156 52.97V49.97A46 8 0 0 1 114 42ZM164 49.97V52.97A46 8 0 0 0 206 45V42A46 8 0 0 1 164 49.97Z"/>
          <path class="t" d="M156 49.97A46 8 0 1 1 164 49.97"/>
          <path class="t fino" d="M157 48.18A40 6.2 0 1 1 163 48.18"/>
        </g>

        <!-- 3 · pistão -->
        <g class="pc" style="--dx:0px;--dy:-7px;--d:.03s">
          <path class="t p" d="M114 62V128A46 8 0 0 0 206 128V62Z"/>
          <ellipse class="t p" cx="160" cy="62" rx="46" ry="8"/>
          <ellipse class="t fino" cx="160" cy="62" rx="41" ry="6.3"/>
          <path class="t fino" d="M114 71A46 8 0 0 0 206 71M114 74A46 8 0 0 0 206 74M114 79A46 8 0 0 0 206 79M114 82A46 8 0 0 0 206 82M114 87A46 8 0 0 0 206 87M114 90A46 8 0 0 0 206 90"/>
          <circle class="t fino" cx="160" cy="108" r="12"/>
          <circle class="t p" cx="160" cy="108" r="8"/>
          <path class="centro" d="M146 108H174"/>
        </g>

        <!-- 4 · pino do pistão -->
        <g class="pc" style="--dx:15px;--dy:8.7px;--d:.12s">
          <path class="t p" d="M226 137.07L248 149.77A8 8 0 0 1 240 163.63L218 150.93A8 8 0 0 1 226 137.07Z"/>
          <circle class="t p" cx="244" cy="156.7" r="8"/>
          <circle class="t fino" cx="244" cy="156.7" r="4.4"/>
        </g>

        <!-- 5 · biela -->
        <g class="pc" style="--dx:0px;--dy:13px;--d:.09s">
          <path class="t p" d="M154 163.5L148 186.8L172 186.8L166 163.5Z"/>
          <path class="t fino" d="M157.5 167L155.5 183.5M162.5 167L164.5 183.5"/>
          <circle class="t p" cx="160" cy="152" r="13"/>
          <circle class="t p" cx="160" cy="152" r="8"/>
          <rect class="t p" x="134" y="194" width="10" height="22" rx="1"/>
          <rect class="t p" x="176" y="194" width="10" height="22" rx="1"/>
          <circle class="t p" cx="160" cy="205" r="21"/>
          <path class="t" d="M134 205H186"/>
          <path class="t oculto" d="M139 191V220M181 191V220"/>
          <circle class="t p" cx="160" cy="205" r="13"/>
          <path class="centro" d="M144 152H176M140 205H180"/>
        </g>

        <!-- 6 · engrenagem -->
        <g class="pc" style="--dx:16px;--dy:4px;--d:.15s">

<script src="config.js?v=20261123b"></script>
<script src="links.js?v=20261123b"></script>
<script src="icones.js?v=20261123b"></script>
<script>
(function () {
  // Liga a animação do desenho só se o navegador aceita movimento
  try {
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const d = document.querySelector(".desenho");
      if (d) d.classList.add("anima");
    }
  } catch (e) {}

  // Ícones próprios, traço técnico 1,6 px
  const S = (d, extra) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (extra || "") + '>' + d + '</svg>';
  const IC = {
    pino: S('<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.4"/>', ' stroke-width="1.9"'),
    mapa: S('<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.4"/><path d="M12 3.5v-1M12 17.5"/>'),
    copiar: S('<rect x="8.5" y="8.5" width="11" height="12" rx="1.5"/><path d="M15.5 8.5V5a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 5v9.5A1.5 1.5 0 0 0 6 16h2.5"/><path d="M11.5 12.5h5M11.5 16h3.5"/>'),
    contato: S('<rect x="3.5" y="5" width="17" height="14" rx="1.5"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16.2c.6-1.7 1.8-2.5 3.2-2.5s2.6.8 3.2 2.5M14.5 10h3.5M14.5 13.5h3.5"/>'),
    email: S('<rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="m4 7 8 6 8-6"/>'),
    compartilhar: S('<circle cx="17.5" cy="5.5" r="2.3"/><circle cx="6.5" cy="12" r="2.3"/><circle cx="17.5" cy="18.5" r="2.3"/><path d="m8.5 10.8 7-4.1M8.5 13.2l7 4.1"/>'),
    ok: S('<path d="m5 12.5 4.5 4.5L19 7.5"/>', ' stroke-width="2.2"'),
    alerta: S('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.3v.2"/>', ' stroke-width="2"'),
    seta: S('<path d="m9 6 6 6-6 6"/>', ' class="seta" stroke-width="2"'),
  };

  // ---------- Fichas das lojas (a partir de LOJAS) ----------
  const fichas = (window.LOJAS || []).map((loja, i) => {
    const zap = loja.links.find(l => l.tipo === "zap");
    const mapa = loja.links.find(l => l.tipo === "mapa");
    const n = String(i + 1).padStart(2, "0");
    const matriz = /matriz/i.test(loja.detalhe || "");
    let h = '<article class="ficha" aria-labelledby="loja-' + i + '">' +
      '<div class="ficha-topo"><span class="ficha-num"><b aria-hidden="true">' + n + '</b>' +
      '<span class="rotulo">Loja ' + n + '</span></span>' +
      '<span class="tipo' + (matriz ? " matriz" : "") + '">' + esc(loja.detalhe || "") + '</span></div>' +
      '<div class="ficha-corpo"><h3 id="loja-' + i + '">' + esc(loja.nome) + '</h3>' +
      '<p class="end"><span class="sr">Endereço: </span>' + IC.pino + '<span>' + esc(loja.endereco) + '</span></p>';
    if (zap) {
      h += '<a class="zap" href="' + esc(zap.url) + '" data-id="' + esc(zap.id) + '"' + alvo(zap.url) +
        ' aria-label="' + esc(zap.titulo + " · " + loja.nome + (zap.sub ? " · " + zap.sub : "")) + '">' +
        '<span class="zico">' + ICO.zap + '</span>' +
        '<span class="ztxt"><strong>' + esc(zap.titulo) + '</strong>' + (zap.sub ? '<small>' + esc(zap.sub) + '</small>' : '') + '</span>' +
        IC.seta + '</a>';
    }
    h += '<div class="acoes">';
    if (mapa) {
      h += '<a class="sec" href="' + esc(mapa.url) + '" data-id="' + esc(mapa.id) + '"' + alvo(mapa.url) +
        ' aria-label="' + esc(mapa.titulo + " até a loja de " + loja.nome) + '"><span class="sic">' + IC.mapa + '</span><span>' + esc(mapa.titulo) + '</span></a>';
    }
    if (zap && zap.sub) {
      h += '<button type="button" class="sec" data-id="' + esc(zap.id.replace(/^zap-/, "copiar-")) + '" data-numero="' + esc(zap.sub) + '"' +
        ' aria-label="' + esc("Copiar número de " + loja.nome + ": " + zap.sub) + '"><span class="sic">' + IC.copiar + '</span><span class="lbl">Copiar número</span></button>';
    }
    return h + '</div></div></article>';
  });
  document.getElementById("fichas").innerHTML = fichas.join("");

  // ---------- Outros (continua a numeração do catálogo) ----------
  let pos = (window.LOJAS || []).length;
  const item = o => {
    pos++;
    const tag = o.tag || "a";
    const attrs = tag === "a" ? ' href="' + esc(o.href) + '"' + alvo(o.href) + (o.extra || "") : ' type="button"';
    return '<li><' + tag + ' class="item"' + attrs + ' data-id="' + esc(o.id) + '">' +
      '<span class="pos" aria-hidden="true">' + String(pos).padStart(2, "0") + '</span>' +
      '<span class="ic">' + o.icone + '</span>' +
      '<span class="tx"><strong>' + esc(o.titulo) + '</strong><small>' + esc(o.sub) + '</small></span>' +
      IC.seta + '</' + tag + '></li>';
  };
  let outros = item({ id: "salvar-contato", href: "admotos.vcf", extra: " download", icone: IC.contato,
    titulo: "Salvar contato", sub: "Todos os contatos na sua agenda" });
  (window.OUTROS || []).forEach(l => {
    outros += item({ id: l.id, href: l.url, icone: IC[l.tipo] || ICO[l.tipo] || IC.email, titulo: l.titulo, sub: l.sub });
  });
  outros += item({ tag: "button", id: "compartilhar", icone: IC.compartilhar, titulo: "Compartilhar", sub: "Envie esta página para alguém" });
  document.getElementById("outros").innerHTML = outros;

  // ---------- Aviso ----------
  const aviso = document.getElementById("aviso");
  let tAviso;
  function avisar(msg, erro) {
    aviso.innerHTML = (erro ? IC.alerta : IC.ok) + "<span></span>";
    aviso.classList.toggle("erro", !!erro);
    aviso.lastChild.textContent = msg.replace(/\((\d+)\) (\d) (\d{4})-(\d{4})/g, "($1)\u00A0$2\u00A0$3\u2011$4");
    aviso.classList.add("mostra");
    clearTimeout(tAviso); tAviso = setTimeout(() => aviso.classList.remove("mostra"), 2400);
  }
  function copiar(texto) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(texto);
    return new Promise((ok, falha) => {
      const t = document.createElement("textarea");
      t.value = texto; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      try { document.execCommand("copy") ? ok() : falha(); } catch (e) { falha(e); }
      t.remove();
    });
  }
  function confirmar(btn, msg) {
    const ic = btn.querySelector(".ic, .sic"), tx = btn.querySelector(".lbl, small");
    if (!btn._orig) btn._orig = [ic.innerHTML, tx.textContent];
    ic.innerHTML = IC.ok; tx.textContent = msg; btn.classList.add("ok");
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { ic.innerHTML = btn._orig[0]; tx.textContent = btn._orig[1]; btn.classList.remove("ok"); }, 2200);
  }

  document.addEventListener("click", ev => {
    const el = ev.target.closest("[data-id]");
    if (!el) return;
    const id = el.dataset.id;
    if (id.startsWith("copiar-")) {
      const num = el.dataset.numero;
      copiar(num).then(() => { confirmar(el, "Copiado!"); avisar("Número copiado: " + num); },
                       () => avisar("Não deu para copiar. Anote: " + num, true));
    } else if (id === "compartilhar") {
      const url = location.href.split("#")[0];
      const dados = { title: "AD Motos", text: "AD Motos · Peças e acessórios para motos", url };
      if (navigator.share) { navigator.share(dados).catch(() => {}); return; }
      copiar(url).then(() => { confirmar(el, "Link copiado"); avisar("Link copiado"); },
                       () => avisar("Não deu para copiar o link", true));
    } else if (id === "salvar-contato") {
      avisar("Baixando o contato da AD Motos");
    }
  });
})();
</script>
