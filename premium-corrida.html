<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AD Motos</title>
<meta name="description" content="Peças e acessórios para a sua moto em Várzea da Roça e Senhor do Bonfim (BA). Chame a loja no WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:title" content="AD Motos">
<meta property="og:description" content="Peças e acessórios para a sua moto. Chame a loja no WhatsApp.">
<meta property="og:image" content="https://helyanaraujo.github.io/admotos-links/og.png">
<meta name="theme-color" content="#001A5C">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Conceito: pintura de moto de corrida (livery). Fundo azul-noite como carenagem,
   faixas diagonais vermelho/branco/azul atravessando a página, lojas como "plaquetas de largada". */
:root {
  --azul: #002C8F;
  --azul-fundo: #001A5C;
  --azul-noite: #000F38;
  --azul-vivo: #1E4FD8;
  --verm: #E92525;
  --verm-esc: #B8121A;
  --branco: #fff;
  --gelo: #EEF2FB;
  --tinta: #0A1638;
  --suave: #4B5675;
  --zap-a: #1FAF5A;
  --zap-b: #0E8444;
  --zap-c: #0A6B37;
  --cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --txt: "Barlow", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --ang: -14deg;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; color: var(--branco);
  background: var(--azul-noite);
  font: 16px/1.45 var(--txt); -webkit-font-smoothing: antialiased;
}
img { display: block; }
a { color: inherit; }
:focus-visible { outline: 3px solid #FFD43B; outline-offset: 3px; border-radius: 4px; }

/* ===== pista: recorta as faixas (sem rolagem horizontal) ===== */
.pista {
  position: relative; overflow: hidden; min-height: 100vh;
  background:
    radial-gradient(120% 60% at 100% 0%, #0A3BB0 0%, transparent 60%),
    linear-gradient(180deg, var(--azul-fundo) 0%, var(--azul-noite) 70%);
}
/* textura fina de carbono */
.pista::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background: repeating-linear-gradient(var(--ang), rgba(255,255,255,.035) 0 2px, transparent 2px 9px);
}

/* ===== faixas da pintura ===== */
.faixas { position: absolute; left: -40%; width: 180%; pointer-events: none; transform: rotate(var(--ang)); transform-origin: 50% 50%; z-index: 0; }
.faixas i { display: block; }
.faixas .vm { height: 74px; background: linear-gradient(90deg, var(--verm-esc), var(--verm) 30%, var(--verm) 80%, #ff3b3b); }
.faixas .br { height: 10px; margin-top: 8px; background: var(--branco); }
.faixas .az { height: 34px; margin-top: 8px; background: var(--azul-vivo); }
.faixas .fi { height: 4px; margin-top: 10px; background: var(--verm); }
.heroi { position: relative; }
.faixas--topo { top: calc(100% + 26px); left: 50%; width: 200vw; margin-left: -100vw; transform: rotate(-10deg); z-index: -1; }
.faixas--topo .vm { height: 56px; } .faixas--topo .az { height: 26px; }
.faixas--meio { top: 1010px; transform: rotate(calc(var(--ang) * -1)); }
.faixas--meio .vm { height: 46px; }
.faixas--meio .az { height: 120px; background: linear-gradient(90deg, var(--azul) 0%, var(--azul-vivo) 100%); opacity: .55; }

/* ===== estrutura ===== */
.grade {
  position: relative; z-index: 1; max-width: 480px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) var(--gut-r) calc(env(safe-area-inset-bottom, 0px) + 0px) var(--gut-l);
}

/* ===== topo / marca ===== */
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.letreiro { width: 148px; height: auto; }
.roda {
  width: 64px; height: 64px; flex: none; border-radius: 50%; background: var(--branco);
  display: grid; place-items: center;
  box-shadow: 0 0 0 4px var(--verm), 0 0 0 7px var(--branco), 0 10px 24px rgba(0,0,0,.35);
}
.roda img { width: 40px; height: 40px; }

/* ===== chamada ===== */
.chamada { margin: 26px 0 0; }
.selo-topo {
  display: inline-flex; align-items: center; gap: 8px; margin: 0 0 14px;
  font: italic 800 14px/1 var(--cond); letter-spacing: .16em; text-transform: uppercase; color: #C9D6FF;
}
.selo-topo::before { content: ""; width: 26px; height: 4px; background: var(--verm); transform: skewX(-20deg); }
h1 { margin: 0; font-family: var(--cond); font-style: italic; text-transform: uppercase; line-height: .9; letter-spacing: -.005em; }
h1 .l { display: block; }
h1 .l1 { font-size: 30px; font-weight: 800; letter-spacing: .01em; }
h1 .l2 { font-size: 86px; font-weight: 900; margin-top: 6px; position: relative; padding: 4px 0 2px; }
h1 .l2 .tag { position: relative; display: inline-block; padding: 0 16px 0 6px; }
h1 .l2 .tag::before {
  content: ""; position: absolute; inset: 6px -2px 4px -10px; z-index: -1;
  background: var(--verm); transform: skewX(-14deg);
  box-shadow: 8px 8px 0 var(--branco);
}
.lead { margin: 20px 0 0; font-size: 18px; color: #DCE4FF; }
.lead b { color: var(--branco); font-weight: 600; }

/* ===== lojas ===== */
.secao { margin-top: 196px; }
.rotulo {
  display: flex; align-items: center; gap: 10px; margin: 0 0 14px;
  font: italic 800 15px/1 var(--cond); letter-spacing: .18em; text-transform: uppercase; color: var(--branco);
}
.rotulo::after { content: ""; flex: 1; height: 2px; background: linear-gradient(90deg, rgba(255,255,255,.6), transparent); }
.chev { display: inline-flex; gap: 2px; color: var(--verm); }
.chev svg { width: 12px; height: 14px; }

.lojas { display: grid; gap: 22px; }
.carro { filter: drop-shadow(0 18px 30px rgba(0, 8, 40, .55)); }
.loja {
  position: relative; overflow: hidden; color: var(--tinta); background: var(--branco);
  padding: 20px 18px 18px;
  clip-path: polygon(0 0, calc(100% - 34px) 0, 100% 34px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
}
/* faixas da carenagem no canto do cartão */
.loja .pint { position: absolute; top: -26px; right: -60px; width: 220px; height: 110px; transform: rotate(var(--ang)); pointer-events: none; }
.loja .pint i { display: block; }
.loja .pint i:nth-child(1) { height: 26px; background: var(--azul); }
.loja .pint i:nth-child(2) { height: 5px; margin-top: 5px; background: var(--verm); }
.loja .pint i:nth-child(3) { height: 12px; margin-top: 5px; background: var(--azul-vivo); opacity: .35; }
.loja--filial .pint i:nth-child(1) { background: var(--verm); }
.loja--filial .pint i:nth-child(2) { background: var(--azul); }
.loja--filial .pint i:nth-child(3) { background: var(--verm); opacity: .25; }

.placa {
  position: relative; display: inline-flex; align-items: stretch; height: 46px;
  font-family: var(--cond); font-style: italic; text-transform: uppercase; color: var(--branco);
}
.placa::before {
  content: ""; position: absolute; inset: 0; background: var(--azul);
  clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
}
.placa > * { position: relative; }
.placa b { font-weight: 900; font-size: 44px; line-height: 46px; padding: 0 10px 0 16px; letter-spacing: -.02em; }
.placa span {
  display: flex; align-items: center; padding: 0 18px 0 12px; font-weight: 800; font-size: 16px; letter-spacing: .14em;
  border-left: 3px solid rgba(255,255,255,.9); margin: 9px 0;
}
.loja--filial .placa::before { background: var(--verm-esc); }

.loja h3 {
  margin: 14px 0 0; font: italic 900 38px/.95 var(--cond); text-transform: uppercase; color: var(--azul);
  letter-spacing: -.005em;
}
.loja--filial h3 { color: var(--verm-esc); }
.end { margin: 8px 0 16px; display: flex; gap: 6px; align-items: center; color: var(--suave); font-size: 15px; }
.end svg { flex: none; color: var(--verm); }

/* botão principal: WhatsApp */
.zap {
  position: relative; display: flex; align-items: center; gap: 12px; min-height: 70px; padding: 10px 18px 10px 14px;
  text-decoration: none; color: var(--branco); isolation: isolate;
  -webkit-tap-highlight-color: transparent; transition: transform .14s ease;
}
.zap::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(105deg, var(--zap-a) 0%, var(--zap-b) 42%, var(--zap-c) 100%);
  clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
}
.zap::after { /* brilho que passa */
  content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%; z-index: -1;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  transform: skewX(-20deg); opacity: 0;
}
.zap:active { transform: scale(.985); }
.zap.vai::after { animation: brilho .6s ease-out; }
.zap .ic {
  width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 50%;
  background: var(--branco); color: var(--zap-b);
}
.zap .ic svg { width: 26px; height: 26px; }
.zap .tx { display: grid; gap: 2px; min-width: 0; flex: 1; }
.zap .t1 { font: italic 800 23px/1 var(--cond); text-transform: uppercase; letter-spacing: .01em; }
.zap .t2 { font-size: 15.5px; font-weight: 600; letter-spacing: .02em; color: #F2FFF7; }
.zap .seta { flex: none; width: 22px; height: 22px; }

.sec { display: grid; grid-template-columns: 1.35fr 1fr; gap: 8px; margin-top: 10px; }
.mini {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 8px 12px;
  font: italic 800 17px/1 var(--cond); text-transform: uppercase; letter-spacing: .04em; text-decoration: none;
  color: var(--azul); background: none; border: 0; cursor: pointer; isolation: isolate;
  -webkit-tap-highlight-color: transparent; transition: transform .14s ease;
}
.mini::before {
  content: ""; position: absolute; inset: 0; z-index: -1; background: var(--gelo);
  clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  transition: background-color .15s ease;
}
.mini:hover::before { background: #DFE7FA; }
.mini:active { transform: scale(.97); }
.mini svg { width: 19px; height: 19px; flex: none; }
.mini--mapa { color: var(--branco); }
.mini--mapa::before { background: var(--azul); }
.mini--mapa:hover::before { background: #0A3AAE; }
.loja--filial .mini--mapa::before { background: var(--verm-esc); }
.loja--filial .mini--mapa:hover::before { background: #9E0F16; }

/* ===== atalhos ===== */
.atalhos { margin-top: 44px; }
.pit { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 14px;
  min-height: 104px; padding: 14px 16px; text-align: left; cursor: pointer; text-decoration: none;
  color: var(--branco); background: #0B2470; border: 1px solid rgba(255,255,255,.22);
  font: inherit; -webkit-tap-highlight-color: transparent;
  transition: background-color .15s ease, transform .14s ease, border-color .15s ease;
}
.tile:hover { background: #12308C; border-color: rgba(255,255,255,.45); }
.tile:active { transform: scale(.975); }
.tile .ti {
  width: 38px; height: 38px; display: grid; place-items: center; color: var(--branco); background: var(--verm);
  clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
}
.tile .ti svg { width: 20px; height: 20px; }
.tile .tl { font: italic 800 20px/1 var(--cond); text-transform: uppercase; letter-spacing: .03em; }
.tile .ts { display: block; margin-top: 4px; font: 500 14px/1.25 var(--txt); color: #C9D6FF; text-transform: none; font-style: normal; letter-spacing: 0; overflow-wrap: anywhere; }
.tile--largo { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: flex-start; min-height: 72px; }
.tile--largo .ti { background: var(--branco); color: var(--azul); }
.tile--largo .seta { margin-left: auto; flex: none; opacity: .8; }

/* ===== rodapé com bandeira quadriculada ===== */
.rodape { margin-top: 56px; position: relative; z-index: 1; }
.xadrez {
  height: 36px; transform: skewY(-3deg); transform-origin: 0 0; margin-bottom: -6px;
  background: conic-gradient(var(--branco) 25%, #0B1130 0 50%, var(--branco) 0 75%, #0B1130 0) 0 0 / 18px 18px;
  border-top: 5px solid var(--verm);
}
.rodape .base {
  background: #000A28; padding: 34px var(--gut-r) calc(env(safe-area-inset-bottom, 0px) + 30px) var(--gut-l);
  text-align: center; color: #AFBEE8; font-size: 14px;
}
.rodape .marca { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.rodape .marca .roda { width: 40px; height: 40px; box-shadow: 0 0 0 3px var(--verm); }
.rodape .marca .roda img { width: 26px; height: 26px; }
.rodape .marca img.let { width: 112px; height: auto; }
.rodape p { margin: 4px 0 0; }

/* ===== aviso ===== */
.aviso {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); z-index: 60;
  transform: translate(-50%, 140%); padding: 13px 26px; pointer-events: none;
  font: italic 800 17px/1 var(--cond); text-transform: uppercase; letter-spacing: .08em; color: var(--tinta);
  background: #FFD43B; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  transition: transform .28s cubic-bezier(.2,.9,.25,1.2), visibility 0s linear .3s; white-space: nowrap; visibility: hidden;
}
.aviso.on { transform: translate(-50%, 0); visibility: visible; transition: transform .28s cubic-bezier(.2,.9,.25,1.2); }

/* ===== largada: faixas que passam pela tela ===== */
.largada { position: fixed; inset: 0; z-index: 80; pointer-events: none; overflow: hidden; }
.largada i {
  position: absolute; top: -20%; bottom: -20%; left: 0; width: 46vw; min-width: 220px;
  transform: translateX(-120%) skewX(-18deg);
  animation: passa .82s cubic-bezier(.65,0,.35,1) forwards;
}
.largada i:nth-child(1) { background: var(--azul); animation-delay: 0s; }
.largada i:nth-child(2) { background: var(--branco); width: 12vw; min-width: 50px; animation-delay: .07s; }
.largada i:nth-child(3) { background: var(--verm); animation-delay: .13s; }
@keyframes passa { to { transform: translateX(calc(100vw + 140%)) skewX(-18deg); } }

/* entradas (só transform/clip: nada fica invisível parado) */
@keyframes entraFaixa { from { transform: translateX(-105%); } to { transform: none; } }
@keyframes entraFaixaD { from { transform: translateX(105%); } to { transform: none; } }
@keyframes revela { from { clip-path: inset(0 100% 0 0); transform: translateX(-30px); } to { clip-path: inset(0 0 0 0); transform: none; } }
@keyframes sobe { from { transform: translateY(28px); } to { transform: none; } }
@keyframes brilho { 0% { opacity: 1; left: -40%; } 100% { opacity: 1; left: 120%; } }
.faixas--topo i { animation: entraFaixa .75s cubic-bezier(.2,.85,.2,1) both; }
.faixas--topo i:nth-child(1) { animation-delay: .45s; }
.faixas--topo i:nth-child(2) { animation-delay: .52s; }
.faixas--topo i:nth-child(3) { animation-delay: .58s; }
.faixas--topo i:nth-child(4) { animation-delay: .64s; }
.faixas--meio i { animation: entraFaixaD .9s cubic-bezier(.2,.85,.2,1) .7s both; }
h1 .l, .selo-topo { animation: revela .6s cubic-bezier(.2,.85,.2,1) both; }
.selo-topo { animation-delay: .35s; }
h1 .l1 { animation-delay: .42s; }
h1 .l2 { animation-delay: .52s; }
.carro { animation: sobe .7s cubic-bezier(.2,.85,.2,1) both; }
.carro:nth-child(1) { animation-delay: .62s; }
.carro:nth-child(2) { animation-delay: .72s; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .largada { display: none; }
}

/* telas estreitas */
@media (max-width: 359px) {
  h1 .l2 { font-size: 78px; }
  h1 .l1 { font-size: 26px; }
  .loja h3 { font-size: 33px; }
  .zap .t1 { font-size: 20px; }
}

/* ===== computador ===== */
@media (min-width: 960px) {
  :root { --ang: -12deg; }
  .grade {
    max-width: 1120px; display: grid; grid-template-columns: 1fr 460px; column-gap: 72px; align-items: start;
    padding-top: 44px;
  }
  .heroi { padding-bottom: 0; }
  .letreiro { width: 190px; }
  .roda { width: 76px; height: 76px; } .roda img { width: 48px; height: 48px; }
  .topo { justify-content: flex-start; gap: 26px; }
  .chamada { margin-top: 80px; }
  h1 .l1 { font-size: 44px; }
  h1 .l2 { font-size: 150px; }
  .lead { font-size: 20px; margin-top: 30px; }
  .principal { grid-column: 2; }
  .secao { margin-top: 8px; }
  .faixas--topo { top: calc(100% + 40px); transform: rotate(-12deg); }
  .faixas--topo .vm { height: 110px; } .faixas--topo .az { height: 50px; }
  .faixas--meio { top: 760px; }
  .rodape .xadrez { height: 44px; background-size: 22px 22px; }
}
</style>
</head>
<body>
<div class="largada" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="pista">
  <div class="faixas faixas--meio" aria-hidden="true"><i class="vm"></i><i class="br"></i><i class="az"></i></div>

  <div class="grade">
    <header class="heroi">
      <div class="topo">
        <img class="letreiro" src="letreiro-branco.svg" alt="AD Motos" width="148" height="30">
        <div class="roda" aria-hidden="true"><img src="favicon.svg" alt="" width="40" height="40"></div>
      </div>
      <div class="chamada">
        <p class="selo-topo">Várzea da Roça · Senhor do Bonfim</p>
        <h1>
          <span class="l l1">Peças e acessórios para a</span>
          <span class="l l2"><span class="tag">sua moto</span></span>
        </h1>
        <p class="lead">Escolha a loja e <b>chame no WhatsApp.</b></p>
      </div>
      <div class="faixas faixas--topo" aria-hidden="true"><i class="vm"></i><i class="br"></i><i class="az"></i><i class="fi"></i></div>
    </header>

    <main class="principal">
      <section class="secao" aria-labelledby="t-lojas">
        <h2 class="rotulo" id="t-lojas"><span class="chev" aria-hidden="true"><svg viewBox="0 0 12 14"><path d="M0 0h5l7 7-7 7H0l7-7z" fill="currentColor"/></svg><svg viewBox="0 0 12 14"><path d="M0 0h5l7 7-7 7H0l7-7z" fill="currentColor"/></svg></span>Escolha a loja</h2>
        <div class="lojas" id="lojas"></div>
      </section>

      <section class="atalhos" aria-labelledby="t-atalhos">
        <h2 class="rotulo" id="t-atalhos"><span class="chev" aria-hidden="true"><svg viewBox="0 0 12 14"><path d="M0 0h5l7 7-7 7H0l7-7z" fill="currentColor"/></svg><svg viewBox="0 0 12 14"><path d="M0 0h5l7 7-7 7H0l7-7z" fill="currentColor"/></svg></span>Atalhos</h2>
        <div class="pit" id="pit">
          <a class="tile" href="admotos.vcf" data-id="salvar-contato" download>
            <span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M19 8v6M16 11h6"/></svg></span>
            <span class="tl">Salvar contato<span class="ts">As duas lojas</span></span>
          </a>
          <button class="tile" type="button" data-id="compartilhar" id="compartilhar">
            <span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></span>
            <span class="tl">Compartilhar<span class="ts">Mande para um amigo</span></span>
          </button>
        </div>
      </section>
    </main>
  </div>

  <footer class="rodape">
    <div class="xadrez" aria-hidden="true"></div>
    <div class="base">
      <div class="marca">
        <span class="roda" aria-hidden="true"><img src="favicon.svg" alt="" width="26" height="26"></span>
        <img class="let" src="letreiro-branco.svg" alt="AD Motos" width="112" height="22">
      </div>
      <p>Peças e acessórios para motos</p>
      <p>Várzea da Roça · Senhor do Bonfim · BA</p>
    </div>
  </footer>
</div>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="links.js"></script>
<script src="icones.js"></script>
<script>
(function () {
  const LOJAS = window.LOJAS || [], OUTROS = window.OUTROS || [];
  const ICONE = window.ICO || {}, SETA = window.SETA || "";
  const e = window.esc || (s => String(s)), alvoDe = window.alvo || (() => "");

  // ---- lojas ----
  const html = LOJAS.map((loja, i) => {
    const zap = loja.links.find(l => l.tipo === "zap");
    const mapa = loja.links.find(l => l.tipo === "mapa");
    const resto = loja.links.filter(l => l !== zap && l !== mapa);
    const filial = i > 0;
    const num = String(i + 1).padStart(2, "0");
    const chave = zap ? zap.id.replace(/^zap-/, "") : "loja" + (i + 1);
    let h = '<div class="carro"><article class="loja' + (filial ? " loja--filial" : "") + '" aria-label="' + e(loja.nome + " — " + loja.detalhe) + '">'
      + '<div class="pint" aria-hidden="true"><i></i><i></i><i></i></div>'
      + '<div class="placa"><b aria-hidden="true">' + num + '</b><span>' + e(loja.detalhe) + '</span></div>'
      + '<h3>' + e(loja.nome) + '</h3>'
      + '<p class="end">' + (ICONE.pino || "") + '<span>' + e(loja.endereco) + '</span></p>';
    if (zap) {
      h += '<a class="zap" data-id="' + e(zap.id) + '" href="' + e(zap.url) + '"' + alvoDe(zap.url)
        + ' aria-label="' + e(zap.titulo + " — " + loja.nome + (zap.sub ? ", " + zap.sub : "")) + '">'
        + '<span class="ic">' + (ICONE.zap || "") + '</span>'
        + '<span class="tx"><span class="t1">' + e(zap.titulo) + '</span>'
        + (zap.sub ? '<span class="t2">' + e(zap.sub) + '</span>' : "") + '</span>' + SETA + '</a>';
    }
    h += '<div class="sec">';
    if (mapa) {
      h += '<a class="mini mini--mapa" data-id="' + e(mapa.id) + '" href="' + e(mapa.url) + '"' + alvoDe(mapa.url)
        + ' aria-label="' + e(mapa.titulo + " — " + loja.nome) + '">' + (ICONE.mapa || "") + e(mapa.titulo) + '</a>';
    }
    if (zap && zap.sub) {
      h += '<button class="mini" type="button" data-id="copiar-' + e(chave) + '" data-copiar="' + e(zap.sub)
        + '" aria-label="' + e("Copiar número de " + loja.nome) + '">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>Copiar nº</button>';
    }
    h += '</div>';
    resto.forEach(l => {
      h += '<a class="mini" style="margin-top:8px" data-id="' + e(l.id) + '" href="' + e(l.url) + '"' + alvoDe(l.url) + '>'
        + (ICONE[l.tipo] || ICONE.site || "") + e(l.titulo) + '</a>';
    });
    return h + '</article></div>';
  }).join("");
  document.getElementById("lojas").innerHTML = html;

  // ---- outros (e-mail etc.) ----
  const pit = document.getElementById("pit");
  pit.insertAdjacentHTML("beforeend", OUTROS.map(o =>
    '<a class="tile tile--largo" data-id="' + e(o.id) + '" href="' + e(o.url) + '"' + alvoDe(o.url) + '>'
    + '<span class="ti">' + (ICONE[o.tipo] || ICONE.site || "") + '</span>'
    + '<span class="tl">' + e(o.titulo) + (o.sub ? '<span class="ts">' + e(o.sub) + '</span>' : "") + '</span>' + SETA + '</a>'
  ).join(""));

  // ---- aviso ----
  const aviso = document.getElementById("aviso");
  let tAviso;
  function avisar(txt) {
    aviso.textContent = txt; aviso.classList.add("on");
    clearTimeout(tAviso); tAviso = setTimeout(() => aviso.classList.remove("on"), 2200);
  }
  async function copiar(txt) {
    try { await navigator.clipboard.writeText(txt); return true; } catch (err) {}
    try {
      const t = document.createElement("textarea");
      t.value = txt; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(t); t.select(); const ok = document.execCommand("copy"); t.remove(); return ok;
    } catch (err) { return false; }
  }

  // ---- copiar número ----
  document.addEventListener("click", async ev => {
    const b = ev.target.closest("[data-copiar]");
    if (!b) return;
    const ok = await copiar(b.dataset.copiar);
    avisar(ok ? "Número copiado" : b.dataset.copiar);
  });

  // ---- compartilhar ----
  const PUBLICO = "https://helyanaraujo.github.io/admotos-links/";
  document.getElementById("compartilhar").addEventListener("click", async () => {
    const url = /^https?:/.test(location.protocol) ? location.href.split("#")[0] : PUBLICO;
    const dados = { title: "AD Motos", text: "Peças e acessórios para a sua moto. Chame a AD Motos no WhatsApp:", url };
    if (navigator.share) {
      try { await navigator.share(dados); return; } catch (err) { if (err && err.name === "AbortError") return; }
    }
    avisar((await copiar(url)) ? "Link copiado" : url);
  });

  // ---- toque no WhatsApp: brilho passando ----
  document.addEventListener("click", ev => {
    const z = ev.target.closest(".zap");
    if (!z) return;
    z.classList.remove("vai"); void z.offsetWidth; z.classList.add("vai");
  });

  // ---- remove a camada da largada ao terminar ----
  const lg = document.querySelector(".largada");
  if (lg) {
    const fim = () => lg.remove();
    const ultima = lg.lastElementChild;
    if (ultima) ultima.addEventListener("animationend", fim, { once: true });
    setTimeout(fim, 1600);
  }
})();
</script>
<script src="rastreio.js"></script>
</body>
</html>
