<!doctype html>
<!--
  IDENTIDADE VISUAL — "Painel de ferramentas" (moto-bancada.html)
  Motivo: painel perfurado azul de loja de peças, com ferramentas e peças desenhadas em traço fino branco
  (chave de boca, vela, corrente, disco de freio, capacete, coroa), penduradas em ganchos alinhados à grade de furos.
  Cores: azul da marca no painel, branco nas etiquetas, vermelho só no logo e nas plaquetas de seção, verde só no WhatsApp.
  Tipografia: Barlow Condensed (cidades e títulos, eco do letreiro condensado) + Barlow (textos e botões).
  Ícones próprios em traço 2 px arredondado. Detalhe memorável: cada loja é uma etiqueta branca pendurada pelo furo
  num gancho do painel — e todo gancho cai exatamente num furo da grade.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AD Motos</title>
<meta name="description" content="AD Motos — peças e acessórios para motos em Várzea da Roça, Senhor do Bonfim e Capim Grosso (BA). Fale com a gente pelo WhatsApp.">
<meta name="theme-color" content="#0636A6">
<meta property="og:title" content="AD Motos">
<meta property="og:description" content="Peças e acessórios para a sua moto. Fale com a gente pelo WhatsApp.">
<meta property="og:image" content="https://helyanaraujo.github.io/admotos-links/og.png">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#002C8F; --azul-2:#0636A6; --azul-3:#00226F; --furo:#001A57;
  --vermelho:#D21F1F; --verde:#12874A; --verde-2:#0F7A42;
  --tinta:#0A1A44; --texto:#46526E; --linha:#D9E1F2; --claro:#F1F5FF;
  --gy:0px;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{
  background-color:var(--azul);
  /* painel perfurado: furo + brilho na borda inferior do furo + luz de cima + degradê do painel */
  background-image:
    radial-gradient(circle at 50% 50%, var(--furo) 0 2.5px, transparent 3px),
    radial-gradient(circle at 50% 57%, rgba(255,255,255,.13) 0 2.7px, transparent 3.2px),
    radial-gradient(70% 520px at 50% 0, rgba(255,255,255,.11), transparent 100%),
    linear-gradient(var(--azul-2), var(--azul) 560px, var(--azul-3));
  background-size:24px 24px,24px 24px,100% 100%,100% 100%;
  background-repeat:repeat,repeat,no-repeat,no-repeat;
  background-position:50% var(--gy),50% var(--gy),0 0,0 0;
  min-height:100%;
  -webkit-text-size-adjust:100%;
}
body{margin:0;font-family:var(--sans);color:var(--tinta);overflow-x:hidden;min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom)}
a,button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid #FFD23F;outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- topo: painel com ferramentas ---------- */
.painel{position:relative;height:228px;overflow:hidden;margin-top:env(safe-area-inset-top)}
.palco{position:absolute;top:0;left:50%;width:390px;height:240px;margin-left:-195px}
.ferramentas{position:absolute;top:0;left:-420px;width:1230px;height:240px;pointer-events:none}
.t{fill:#0B39A8;stroke:#F2F6FF;stroke-width:1.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.t2{fill:#1446BA}
.d{fill:none;stroke:#A9C0FF;stroke-width:1;stroke-linecap:round;vector-effect:non-scaling-stroke}
.b{fill:none;stroke:#F2F6FF;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}

.cartaz{position:absolute;left:97px;top:50px;width:196px;padding:14px 14px 12px;background:#fff;border-radius:6px;
  box-shadow:0 10px 22px rgba(0,14,58,.38),0 1px 0 rgba(0,0,0,.04)}
.cartaz::before{content:"";position:absolute;inset:5px;border:1px solid #E4E9F4;border-radius:3px;pointer-events:none}
.cartaz img{display:block;width:100%;height:auto;position:relative}
.ilhos{position:absolute;top:5px;width:8px;height:8px;border-radius:50%;border:1.6px solid #B9C4DC;background:var(--azul-2)}
.ilhos.e{left:9px}.ilhos.d2{right:9px}

.chamada{position:absolute;left:50%;top:148px;width:220px;margin-left:-110px;text-align:center;color:#fff}
.chamada h1{margin:0;font-family:var(--cond);font-weight:600;font-size:23px;line-height:1.08;letter-spacing:.035em;text-transform:uppercase}
.chamada p{margin:7px 0 0;font-size:14.5px;line-height:1.35;color:rgba(255,255,255,.84)}

/* ---------- conteúdo ---------- */
main{width:100%;max-width:472px;margin:0 auto;
  padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.secao{display:flex;justify-content:center;margin:0}
.placa{position:relative;display:inline-block;padding:5px 16px 5px;background:var(--vermelho);color:#fff;border-radius:3px;
  font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.17em;text-transform:uppercase;line-height:1.2;
  box-shadow:0 3px 8px rgba(0,10,45,.3)}
.placa::before,.placa::after{content:"";position:absolute;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;
  background:rgba(255,255,255,.7)}
.placa::before{left:6px}.placa::after{right:6px}

/* etiqueta pendurada */
.loja{position:relative;padding-top:40px;margin-top:20px}
.gancho{position:absolute;left:50%;top:0;width:4px;height:29px;margin-left:-2px;border-radius:2px;
  background:linear-gradient(90deg,#9AA8C9,#F4F7FF 45%,#B6C2DE);box-shadow:1px 2px 2px rgba(0,10,40,.35);z-index:2}
.gancho::before{content:"";position:absolute;left:50%;top:-1px;width:10px;height:10px;margin-left:-5px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#E9EEFA 0 2px,#8E9DC1 2.6px 3.6px,var(--furo) 4px)}
.tag{position:relative;background:#fff;border-radius:16px;padding:15px 18px 16px;
  filter:drop-shadow(0 10px 16px rgba(0,12,50,.34)) drop-shadow(0 1px 1px rgba(0,12,50,.2))}
.tag::before{content:"";position:absolute;left:50%;top:-24px;width:66px;height:30px;margin-left:-33px;background:#fff;
  border-radius:15px 15px 0 0;
  -webkit-mask:radial-gradient(circle at 50% 12px,transparent 5.6px,#000 6.2px);
          mask:radial-gradient(circle at 50% 12px,transparent 5.6px,#000 6.2px)}
.tag::after{content:"";position:absolute;left:50%;top:-20px;width:16px;height:16px;margin-left:-8px;border-radius:50%;
  border:2px solid #C3CCE0;box-sizing:border-box}
.topo-tag{display:flex;align-items:center;justify-content:space-between;gap:10px}
.selo{display:inline-block;padding:4px 9px 3px;border-radius:4px;font-size:11.5px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;background:var(--azul);color:#fff}
.selo.f{background:#E7EDFC;color:var(--azul)}
.marca{height:10px;width:auto;opacity:.9}
.cidade{margin:8px 0 0;font-family:var(--cond);font-weight:700;font-size:33px;line-height:1;letter-spacing:.005em;color:var(--tinta)}
.end{display:flex;align-items:flex-start;gap:6px;margin:6px 0 0;font-size:14.5px;line-height:1.35;color:var(--texto)}
.end svg{flex:none;margin-top:2px;color:var(--azul)}
.picote{height:0;border-top:1.5px dashed #D3DBEC;margin:12px -18px 13px}

.zap{display:flex;align-items:center;gap:12px;min-height:60px;padding:9px 14px 9px 10px;border-radius:12px;text-decoration:none;
  background:linear-gradient(180deg,#149152,var(--verde-2));color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 4px 10px rgba(15,122,66,.28)}
.zap-ico{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--verde)}
.zap-ico svg{width:25px;height:25px}
.zap-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.zap-txt strong{font-size:18px;font-weight:700;letter-spacing:.005em}
.zap-txt span{margin-top:3px;font-size:15px;font-weight:500;color:rgba(255,255,255,.92);font-variant-numeric:tabular-nums}
.seta{flex:none;opacity:.9}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sec{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 10px;border-radius:12px;
  background:var(--claro);border:1px solid var(--linha);color:var(--azul);font-size:15px;font-weight:600;text-decoration:none;
  white-space:nowrap}
.sec svg{flex:none;width:19px;height:19px}

/* mais opções: etiquetas pequenas lado a lado */
.extras{--w:112px;--g:8px;display:flex;flex-wrap:wrap;justify-content:center;gap:52px var(--g);margin-top:12px;padding-top:40px;position:relative}
.mini{position:relative;width:var(--w);flex:none}
.mini .gancho{top:-40px}
.mini .tag{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;height:100%;padding:14px 8px 14px;
  border-radius:14px;text-decoration:none;color:var(--tinta);width:100%}
.mini .tag::before{width:52px;margin-left:-26px}
.m-ico{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#EAF0FF;color:var(--azul)}
.m-ico svg{width:21px;height:21px}
.m-tit{margin-top:9px;font-size:14.5px;font-weight:700;line-height:1.15}
.m-sub{margin-top:4px;font-size:11.5px;line-height:1.3;color:var(--texto);overflow-wrap:anywhere}

footer{margin:34px 0 0;padding:0 16px 30px;text-align:center;color:rgba(255,255,255,.78);font-size:13px;line-height:1.5}
.rodape-marca{display:inline-flex;align-items:center;gap:10px;margin-bottom:6px}
.rodape-marca .simb{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff}
.rodape-marca .simb img{width:19px;height:19px}
.rodape-marca img.letra{height:13px;width:auto}

.aviso{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;
  display:none;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:#fff;color:var(--tinta);
  font-weight:600;font-size:15px;box-shadow:0 10px 26px rgba(0,12,50,.4)}
.aviso.on{display:inline-flex}
.aviso svg{color:var(--verde)}

@media (min-width:480px){ .extras{--w:136px} }
@media (min-width:760px){
  .painel{height:236px}
  main{max-width:488px}
}
/* ---------- animação: um balanço suave na entrada; etiqueta balança (~3°) ao tocar ---------- */
@keyframes balanco{0%{transform:rotate(0)}16%{transform:rotate(2.2deg)}36%{transform:rotate(-1.5deg)}56%{transform:rotate(.8deg)}76%{transform:rotate(-.3deg)}100%{transform:rotate(0)}}
@keyframes assenta{0%{transform:rotate(1.8deg)}30%{transform:rotate(-1.1deg)}55%{transform:rotate(.55deg)}78%{transform:rotate(-.2deg)}100%{transform:rotate(0)}}
@keyframes toque{0%{transform:rotate(0)}14%{transform:rotate(3deg)}34%{transform:rotate(-2deg)}54%{transform:rotate(1.1deg)}74%{transform:rotate(-.45deg)}100%{transform:rotate(0)}}
.bal{transform-box:view-box;animation:balanco 2s cubic-bezier(.37,0,.32,1) var(--d,0s) 1 both}
.cartaz{transform-origin:98px -38px;animation:balanco 2s cubic-bezier(.37,0,.32,1) .1s 1 both}
.tag{transform-origin:50% -12px;animation:assenta 1.6s cubic-bezier(.37,0,.32,1) var(--d,0s) 1 both}
.tag.toque{animation:toque 1.2s cubic-bezier(.33,0,.3,1) 0s 1 both}
@media (prefers-reduced-motion:reduce){
  .bal,.cartaz,.tag,.tag.toque{animation:none!important}
}
</style>
</head>

    if (mapa) {
      h += '<a class="sec" href="' + E(mapa.url) + '" data-id="' + E(mapa.id) + '"' + A(mapa.url) +
        ' aria-label="' + E(mapa.titulo + " até a loja de " + l.nome) + '">' + IC.rota + E(mapa.titulo) + '</a>';
    }
    if (zap && zap.sub) {
      h += '<button type="button" class="sec" data-id="' + E(zap.id.replace(/^zap-/, "copiar-")) + '" data-copiar="' + E(zap.sub) +
        '" aria-label="' + E("Copiar número de " + l.nome + ", " + zap.sub) + '">' + IC.copiar + 'Copiar número</button>';
    }
    outros.forEach(function (k) {
      h += '<a class="sec" href="' + E(k.url) + '" data-id="' + E(k.id) + '"' + A(k.url) + '>' + (IC[k.tipo] || "") + E(k.titulo) + '</a>';
    });
    h += '</div></div></article>';
  });
  document.getElementById("lojas").innerHTML = h;

  // ---- mais opções ----
  var nMini = 0;
  function mini(tag, attrs, ico, tit, sub) {
    var d = (0.6 + 0.1 * nMini++).toFixed(2);
    return '<div class="mini">' + gancho() + '<' + tag + ' class="tag" style="--d:' + d + 's" ' + attrs + '><span class="m-ico">' + ico + '</span>' +
      '<span class="m-tit">' + tit + '</span>' + (sub ? '<span class="m-sub">' + sub + '</span>' : '') + '</' + tag + '></div>';
  }
  var x = mini("a", 'href="admotos.vcf" data-id="salvar-contato" download', IC.contato, "Salvar contato", "Na agenda do celular");
  OUTROS.forEach(function (o) {
    x += mini("a", 'href="' + E(o.url) + '" data-id="' + E(o.id) + '"' + A(o.url), IC[o.tipo] || IC.site,
      E(o.curto || o.titulo), o.sub ? E(o.sub).replace("@", "@<wbr>") : "");
  });
  x += mini("button", 'type="button" data-id="compartilhar"', IC.partilhar, "Compartilhar", "Enviar esta página");
  document.getElementById("extras").innerHTML = x;

  // ---- aviso ----
  var aviso = document.getElementById("aviso"), tAviso;
  function avisar(msg) {
    aviso.innerHTML = IC.ok + '<span>' + E(msg) + '</span>';
    aviso.classList.add("on");
    clearTimeout(tAviso); tAviso = setTimeout(function () { aviso.classList.remove("on"); }, 2200);
  }
  function copiar(txt) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt).catch(function () { return copiarAntigo(txt); });
    return copiarAntigo(txt);
  }
  function copiarAntigo(txt) {
    return new Promise(function (ok, erro) {
      var t = document.createElement("textarea"); t.value = txt; t.setAttribute("readonly", "");
      t.style.cssText = "position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(t); t.select();
      try { document.execCommand("copy") ? ok() : erro(); } catch (e) { erro(e); } document.body.removeChild(t);
    });
  }
  var calmo = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)");
  document.addEventListener("click", function (ev) {
    var tg = ev.target.closest(".tag");
    if (tg && !(calmo && calmo.matches)) { tg.classList.remove("toque"); void tg.offsetWidth; tg.classList.add("toque"); }
    var b = ev.target.closest("[data-copiar]");
    if (b) { copiar(b.getAttribute("data-copiar")).then(function () { avisar("Número copiado"); }, function () { avisar("Não deu para copiar"); }); return; }
    if (ev.target.closest('[data-id="compartilhar"]')) {
      var dados = { title: "AD Motos", text: "AD Motos — peças e acessórios para motos. Fale com a gente pelo WhatsApp.", url: location.href };
      if (navigator.share) { navigator.share(dados).catch(function () {}); }
      else copiar(location.href).then(function () { avisar("Link copiado"); }, function () { avisar("Não deu para copiar o link"); });
    }
  });

  // ---- cada gancho cai exatamente num furo da grade (24 px) ----
  var raiz = document.documentElement, painel = document.querySelector(".painel");
  function alinhar() {
    var y0 = painel.getBoundingClientRect().top + scrollY;
    var gy = ((y0 % 24) + 24) % 24;
    raiz.style.setProperty("--gy", gy + "px");
    var alvos = document.querySelectorAll(".loja, .extras");
    for (var i = 0; i < alvos.length; i++) {
      var el = alvos[i]; el.style.marginTop = "";
      var base = parseFloat(getComputedStyle(el).marginTop) || 0;
      var pino = el.getBoundingClientRect().top + scrollY + 4;          // centro do gancho
      var d = (((gy + 12 - pino) % 24) + 24) % 24; if (d > 12) d -= 24;
      el.style.marginTop = (base + d) + "px";
    }
  }
  alinhar();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(alinhar);
  addEventListener("load", alinhar);
  var tr; addEventListener("resize", function () { clearTimeout(tr); tr = setTimeout(alinhar, 80); });
})();
</script>
<script src="rastreio.js"></script>
</body>
</html>
