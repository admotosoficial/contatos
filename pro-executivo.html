<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AD Motos</title>
<meta name="description" content="Fale com a AD Motos: WhatsApp e endereço das lojas de Várzea da Roça e Senhor do Bonfim. Peças e acessórios para a sua moto.">
<meta name="theme-color" content="#FBFBFA">
<meta name="color-scheme" content="light">
<meta property="og:type" content="website">
<meta property="og:title" content="AD Motos">
<meta property="og:description" content="Fale com a AD Motos: WhatsApp e endereço das duas lojas.">
<meta property="og:image" content="https://helyanaraujo.github.io/admotos-links/og.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FBFBFA;
  --surface:#FFFFFF;
  --ink:#0A1330;
  --ink-2:#3B4560;
  --muted:#667089;
  --line:rgba(10,19,48,.09);
  --line-2:rgba(10,19,48,.16);
  --cross:#9AA2B4;
  --blue:#002C8F;
  --blue-d:#00226F;
  --blue-t:rgba(0,44,143,.06);
  --red:#E92525;
  --green:#1FAF5A;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gx:max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
  --pad:18px;
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.5;
  font-feature-settings:"tnum" 1,"ss01" 1;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:clip;min-height:100vh;
}
a{color:inherit}
img{display:block}

/* ---------- moldura (grade visível) ---------- */
.frame{
  position:relative;margin:0 auto;
  width:calc(100% - 2 * var(--gx));max-width:1080px;
  min-height:100vh;
  border-left:1px solid var(--line);border-right:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.frame::before{ /* colunas guia sutis */
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(var(--line),var(--line)) 50% 0/1px 100% no-repeat;
  opacity:0;
}
.sec{position:relative;z-index:1;padding:28px var(--pad)}
.sec::before{ /* linha horizontal que atravessa a tela */
  content:"";position:absolute;left:-100vw;right:-100vw;bottom:-1px;height:1px;background:var(--line);
  transform-origin:left center;
}
.sec::after{ /* marcas de cruzamento */
  content:"";position:absolute;left:-5px;right:-5px;bottom:-5px;height:9px;pointer-events:none;
  background:
    linear-gradient(var(--cross),var(--cross)) left 4px top 0/1px 9px no-repeat,
    linear-gradient(var(--cross),var(--cross)) left 0 top 4px/9px 1px no-repeat,
    linear-gradient(var(--cross),var(--cross)) right 4px top 0/1px 9px no-repeat,
    linear-gradient(var(--cross),var(--cross)) right 0 top 4px/9px 1px no-repeat;
}
.sec > *{position:relative}

/* ---------- topo ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:20px;background:var(--bg)}
.top .logo{height:30px;width:auto}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tag b{font-weight:500;color:var(--ink-2)}

/* ---------- abertura ---------- */
.hero{padding-top:44px;padding-bottom:40px;background:var(--bg)}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 22px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:"";width:18px;height:1px;background:var(--ink)}
h1{margin:0;font-weight:600;font-size:clamp(40px,11vw,72px);line-height:1;letter-spacing:-.045em;color:var(--ink)}
h1 .ponto{color:var(--red);display:inline-block}
.apoio{margin:20px 0 0;max-width:34ch;font-size:17px;line-height:1.5;color:var(--ink-2);letter-spacing:-.005em}

/* ---------- lojas ---------- */
.lojas{padding:0;display:grid;grid-template-columns:1fr;background:var(--surface)}
.lojas::after{display:none}
.loja{position:relative;padding:28px var(--pad) 30px}
.loja + .loja{border-top:1px solid var(--line)}
.rotulo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.rotulo .n{color:var(--muted);font-weight:400}
.cidade{margin:0;font-size:32px;line-height:1.05;font-weight:600;letter-spacing:-.035em}
.end{display:flex;align-items:flex-start;gap:8px;margin:12px 0 24px;font-size:15px;color:var(--muted);line-height:1.4}
.end svg{flex:none;margin-top:2px;color:var(--ink-2)}

.zap{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;
  min-height:68px;padding:12px 16px 12px 12px;border-radius:12px;
  background:var(--blue);color:#fff;text-decoration:none;
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 1px 2px rgba(0,20,70,.18),0 8px 20px -10px rgba(0,44,143,.55);
  transition:background-color .2s var(--ease),transform .2s var(--ease),box-shadow .2s var(--ease);
}
.zap:hover{background:var(--blue-d)}
.zap:active{transform:scale(.985)}
.zap .bola{width:44px;height:44px;border-radius:10px;background:var(--green);display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset}
.zap .bola svg{width:24px;height:24px;color:#fff}
.zap .t{display:block;font-weight:600;font-size:16.5px;letter-spacing:-.01em;line-height:1.2}
.zap .s{display:block;margin-top:3px;font-family:var(--mono);font-size:13px;letter-spacing:.01em;color:rgba(255,255,255,.78)}
.zap .seta{opacity:.85;transition:transform .2s var(--ease)}
.zap:hover .seta{transform:translateX(3px)}

.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.btn{
  -webkit-appearance:none;appearance:none;font:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 12px;border-radius:10px;
  background:var(--surface);color:var(--ink);border:1px solid var(--line-2);
  font-size:14.5px;font-weight:500;letter-spacing:-.005em;text-decoration:none;white-space:nowrap;
  transition:border-color .2s var(--ease),background-color .2s var(--ease),color .2s var(--ease);
}
.btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-t)}
.btn:active{background:rgba(0,44,143,.1)}
.btn svg{width:17px;height:17px;flex:none;color:var(--blue)}
.btn.ok{border-color:var(--blue);color:var(--blue)}

/* ---------- contato ---------- */
.contato{background:var(--bg)}
.titulo-sec{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 8px;
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.titulo-sec span{color:var(--muted);font-weight:400}
.lista{list-style:none;margin:0;padding:0}
.lista li + li{border-top:1px solid var(--line)}
.item{
  -webkit-appearance:none;appearance:none;font:inherit;color:inherit;background:none;border:0;cursor:pointer;
  width:100%;text-align:left;text-decoration:none;
  display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;
  padding:16px 0;min-height:72px;
}
.item .ic{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--blue);background:var(--surface);
  transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
.item .ic svg{width:19px;height:19px}
.item .t{display:block;font-weight:600;font-size:16px;letter-spacing:-.01em;line-height:1.25}
.item .s{display:block;margin-top:2px;font-size:14px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.item .seta{color:var(--muted);transition:transform .2s var(--ease),color .2s var(--ease)}
.item:hover .ic{background:var(--blue);border-color:var(--blue);color:#fff}
.item:hover .seta{transform:translateX(3px);color:var(--blue)}

/* ---------- rodapé ---------- */
.rodape{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:22px;padding-bottom:calc(26px + env(safe-area-inset-bottom));
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rodape::before,.rodape::after{display:none}
.rodape img{height:20px;width:auto}
.rodape .marca{display:flex;align-items:center;gap:10px}

/* ---------- foco ---------- */
a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.zap:focus-visible{outline-color:var(--ink)}

/* ---------- aviso ---------- */
.aviso{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:10;
  transform:translate(-50%,12px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:10px;
  background:var(--ink);color:#fff;font-size:14px;font-weight:500;white-space:nowrap;
  box-shadow:0 10px 30px -10px rgba(10,19,48,.5);
  transition:opacity .25s var(--ease),transform .25s var(--ease);
}
.aviso::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
.aviso.on{opacity:1;transform:translate(-50%,0)}

/* ---------- computador ---------- */
@media (min-width:900px){
  :root{--pad:40px}
  .frame::before{opacity:1}
  .top{padding-top:28px;padding-bottom:28px}
  .top .logo{height:36px}
  .hero{padding-top:88px;padding-bottom:80px;display:grid;grid-template-columns:1fr 1fr;column-gap:80px;align-items:end}
  .hero .eyebrow{grid-column:1 / -1}
  .apoio{margin:0 0 6px;font-size:19px}
  .lojas{grid-template-columns:1fr 1fr}
  .loja{padding:40px var(--pad) 44px}
  .loja + .loja{border-top:0;border-left:1px solid var(--line)}
  .cidade{font-size:44px}
  .contato{padding-top:36px;padding-bottom:40px}
  .titulo-sec{margin-bottom:16px}
  .lista{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
  .lista li + li{border-top:0;border-left:1px solid var(--line)}
  .lista li{padding:0 24px}
  .lista li:first-child{padding-left:0}
  .lista li:last-child{padding-right:0}
  .item{padding:22px 0}
}

/* ---------- entrada ---------- */
@media (prefers-reduced-motion:no-preference){
  .r{animation:sobe .8s var(--ease) both;animation-delay:var(--d,0s)}
  .sec::before{animation:traca 1.1s var(--ease) both;animation-delay:var(--l,0s)}
  h1 .ponto{animation:ponto .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:.75s}
  @keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes traca{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes ponto{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="frame">
  <header class="sec top" style="--l:.05s">
    <img class="logo r" src="logo.svg" alt="AD Motos" width="97" height="30">
    <span class="tag r" style="--d:.08s"><b>2 lojas</b> · Bahia</span>
  </header>

  <section class="sec hero" style="--l:.15s" aria-labelledby="titulo">
    <p class="eyebrow r" style="--d:.1s">Atendimento</p>
    <h1 id="titulo" class="r" style="--d:.16s">Fale com a AD&nbsp;Motos<span class="ponto">.</span></h1>
    <p class="apoio r" style="--d:.24s">Peças e acessórios para a sua moto. Escolha a loja e chame no&nbsp;WhatsApp.</p>
  </section>

  <section class="sec lojas" id="lojas" style="--l:.3s" aria-label="Nossas lojas"></section>

  <section class="sec contato" style="--l:.45s" aria-labelledby="t-contato">
    <h2 class="titulo-sec r" id="t-contato" style="--d:.5s">Contato <span>AD Motos</span></h2>
    <ul class="lista" id="lista"></ul>
  </section>

  <footer class="sec rodape">
    <span class="marca"><img src="favicon.svg" alt="" width="20" height="20"> AD Motos</span>
    <span>Várzea da Roça · Senhor do Bonfim</span>
  </footer>
</div>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="links.js"></script>
<script src="icones.js"></script>
<script>
(function () {
  const COPIAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
  const SALVAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20a6.5 6.5 0 0 1 13 0"/><path d="M19 8v6M16 11h6"/></svg>';
  const PARTILHAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

  const lojas = window.LOJAS || [], outros = window.OUTROS || [];
  const $lojas = document.getElementById("lojas");
  const $lista = document.getElementById("lista");

  // ----- lojas -----
  $lojas.innerHTML = lojas.map((l, i) => {
    const zap = l.links.find(x => x.tipo === "zap");
    const mapa = l.links.find(x => x.tipo === "mapa");
    const d = 0.36 + i * 0.12;
    const copiarId = zap ? zap.id.replace(/^zap-/, "copiar-") : "";
    return `<article class="loja r" style="--d:${d.toFixed(2)}s" aria-labelledby="loja-${i}">
      <p class="rotulo"><span>Loja ${i + 1} · ${esc(l.detalhe)}</span><span class="n">${String(i + 1).padStart(2, "0")}/${String(lojas.length).padStart(2, "0")}</span></p>
      <h2 class="cidade" id="loja-${i}">${esc(l.nome)}</h2>
      <p class="end">${ICO.pino}<span>${esc(l.endereco)}</span></p>
      ${zap ? `<a class="zap" href="${esc(zap.url)}" data-id="${esc(zap.id)}"${alvo(zap.url)} aria-label="${esc(zap.titulo)} – ${esc(l.nome)}, ${esc(zap.sub)}">
        <span class="bola">${ICO.zap}</span>
        <span><span class="t">${esc(zap.titulo)}</span><span class="s">${esc(zap.sub)}</span></span>
        ${SETA}
      </a>` : ""}
      <div class="acoes">
        ${mapa ? `<a class="btn" href="${esc(mapa.url)}" data-id="${esc(mapa.id)}"${alvo(mapa.url)} aria-label="${esc(mapa.titulo)} – ${esc(l.nome)}">${ICO.mapa}<span>${esc(mapa.titulo)}</span></a>` : ""}
        ${zap ? `<button class="btn" type="button" data-id="${esc(copiarId)}" data-copiar="${esc(zap.sub)}" aria-label="Copiar número de ${esc(l.nome)}, ${esc(zap.sub)}">${COPIAR}<span>Copiar número</span></button>` : ""}
      </div>
    </article>`;
  }).join("");

  // ----- contato -----
  const itens = [
    { tag: "a", attrs: `href="admotos.vcf" data-id="salvar-contato" download`, ic: SALVAR, t: "Salvar contato", s: "As duas lojas na sua agenda" },
    ...outros.map(o => ({ tag: "a", attrs: `href="${esc(o.url)}" data-id="${esc(o.id)}"${alvo(o.url)}`, ic: ICO[o.tipo] || ICO.site, t: o.titulo, s: o.sub })),
    { tag: "button", attrs: `type="button" data-id="compartilhar" id="partilhar"`, ic: PARTILHAR, t: "Compartilhar", s: "Envie esta página para alguém" },
  ];
  $lista.innerHTML = itens.map((x, i) =>
    `<li class="r" style="--d:${(0.56 + i * 0.07).toFixed(2)}s"><${x.tag} class="item" ${x.attrs}>
      <span class="ic">${x.ic}</span>
      <span><span class="t">${esc(x.t)}</span>${x.s ? `<span class="s">${esc(x.s)}</span>` : ""}</span>
      ${SETA}
    </${x.tag}></li>`).join("");

  // ----- aviso -----
  const $aviso = document.getElementById("aviso");
  let tAviso;
  function avisar(msg) {
    $aviso.textContent = msg;
    $aviso.classList.add("on");
    clearTimeout(tAviso);
    tAviso = setTimeout(() => $aviso.classList.remove("on"), 2200);
  }

  function copiar(txt) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt);
    return new Promise((ok, falha) => {
      const ta = document.createElement("textarea");
      ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy") ? ok() : falha(); } catch (e) { falha(e); }
      ta.remove();
    });
  }

  // copiar número
  $lojas.addEventListener("click", ev => {
    const b = ev.target.closest("[data-copiar]");
    if (!b) return;
    const num = b.dataset.copiar;
    const span = b.querySelector("span"), icone = b.querySelector("svg");
    copiar(num).then(() => {
      avisar("Número copiado: " + num);
      b.classList.add("ok"); span.textContent = "Copiado"; icone.outerHTML = CHECK;
      setTimeout(() => { b.classList.remove("ok"); span.textContent = "Copiar número"; b.querySelector("svg").outerHTML = COPIAR; }, 2000);
    }, () => avisar("Número: " + num));
  });

  // compartilhar
  document.getElementById("partilhar").addEventListener("click", () => {
    const dados = { title: "AD Motos", text: "Fale com a AD Motos pelo WhatsApp:", url: location.href };
    if (navigator.share) {
      navigator.share(dados).catch(e => { if (!e || e.name !== "AbortError") copiar(location.href).then(() => avisar("Link copiado"), () => {}); });
    } else {
      copiar(location.href).then(() => avisar("Link copiado"), () => avisar("Não foi possível copiar o link"));
    }
  });
})();
</script>
<script src="rastreio.js"></script>
</body>
</html>
