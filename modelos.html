<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Modelos AD Motos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
<style>
/* Galeria: cada modelo num celular de verdade (iframe), com nome e ideia em uma linha. */
:root { --azul: #002C8F; --vermelho: #E92525; --fundo: #EEF1F8; --cartao: #ffffff; --tinta: #10183A; --suave: #5A6380; --linha: #DCE2EF;
  --f: "Ubuntu", "Segoe UI", system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fundo: #0B1020; --cartao: #141B2F; --tinta: #EEF1F8; --suave: #A7B0C8; --linha: #26304A; color-scheme: dark; } }
:root[data-theme="dark"] { --fundo: #0B1020; --cartao: #141B2F; --tinta: #EEF1F8; --suave: #A7B0C8; --linha: #26304A; color-scheme: dark; }
* { box-sizing: border-box; } html, body { margin: 0; }
body { background: var(--fundo); color: var(--tinta); font: 15px/1.45 var(--f); }
.pg { max-width: 1320px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { margin: 0; font-size: 28px; color: var(--azul); text-wrap: balance; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) h1 { color: #8FA8E6; } }
:root[data-theme="dark"] h1 { color: #8FA8E6; }
.intro { color: var(--suave); margin: 6px 0 24px; max-width: 62ch; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px 20px; }
.modelo { display: grid; gap: 10px; min-width: 0; }
.modelo h2 { margin: 0; font-size: 18px; display: flex; gap: 8px; align-items: baseline; }
.modelo h2 span { color: var(--vermelho); font-variant-numeric: tabular-nums; }
.modelo p { margin: 0; color: var(--suave); font-size: 14px; min-height: 2.9em; }
.celular { width: 100%; max-width: 330px; aspect-ratio: 390 / 844; border-radius: 34px; border: 8px solid #0d1222; background: #0d1222;
  overflow: hidden; position: relative; box-shadow: 0 18px 40px rgba(0, 20, 70, .25); }
.celular iframe { position: absolute; top: 0; left: 0; width: 390px; height: 844px; border: 0; transform-origin: 0 0; }
.abrir { font-weight: 500; color: var(--azul); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .abrir { color: #8FA8E6; } }
:root[data-theme="dark"] .abrir { color: #8FA8E6; }
</style>
</head>
<body>
<main class="pg">
  <h1>Modelos da página de links</h1>
  <p class="intro">Cada celular abaixo é a página funcionando de verdade: role dentro dele, toque nos botões, veja as animações.
  Os botões de WhatsApp e mapa abrem de verdade. Escolha o seu favorito pelo número.</p>
  <div class="grade" id="grade"></div>
</main>
<script>
const MODELOS = [
  ["pro-corporativo.html", "A · Grande varejista", "Barra branca com o logo e botão de WhatsApp fixo, faixa azul de destaque, lojas em cartões iguais e rodapé institucional."],
  ["pro-atendimento.html", "B · Atendimento", "\"Olá! Como podemos ajudar?\" e uma lista de ações grandes por loja, como o app de atendimento de uma empresa grande."],
  ["pro-concessionaria.html", "C · Concessionária", "Topo azul-noite de showroom com os dois WhatsApps na primeira tela; cada loja numa ficha."],
  ["pro-localizador.html", "D · Localizador", "Mapa ilustrado com os pinos das duas cidades; toque no pino para ir à loja. Como o \"encontre uma loja\" das grandes redes."],
  ["pro-executivo.html", "E · Executivo", "Institucional minimalista e preciso, com grade fina e \"Fale com a AD Motos.\" em destaque."],
  ["premium-farois.html", "Faróis (premium)", "Estrada noturna animada chegando no ícone da AD Motos, cartões de vidro e um botão principal que abre a escolha da loja."],
  ["premium-vitrine.html", "Vitrine (premium)", "Estilo Apple: claro, letras enormes, cartões grandes e o botão do WhatsApp fixo no rodapé."],
  ["premium-painel-moto.html", "Painel de moto (no ar)", "Painel digital de moto: o conta-giros acelera ao abrir; cada loja é um modo do painel."],
  ["premium-aurora.html", "Aurora (premium)", "Degradê animado com as cores da marca, anel de stories no símbolo e botões de vidro fosco."],
];
const grade = document.getElementById("grade");
grade.innerHTML = MODELOS.map(([arq, nome, ideia], i) => `
  <article class="modelo">
    <h2>${nome}</h2>
    <p>${ideia}</p>
    <div class="celular"><iframe src="${arq}" title="Modelo ${nome}" loading="lazy"></iframe></div>
    <a class="abrir" href="${arq}" target="_blank" rel="noopener">Abrir em tela cheia</a>
  </article>`).join("");
function escala() {
  document.querySelectorAll(".celular").forEach(c => { const f = c.querySelector("iframe"); f.style.transform = `scale(${c.clientWidth / 390})`; });
}
addEventListener("resize", escala); escala();
</script>
</body>
</html>
