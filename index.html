<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AD Motos</title>
<meta name="description" content="Peças e acessórios para a sua moto em Capim Grosso, Senhor do Bonfim e Várzea da Roça (BA). Fale com a loja pelo WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:title" content="AD Motos">
<meta property="og:description" content="Peças e acessórios para a sua moto. Fale com a gente pelo WhatsApp.">
<meta property="og:image" content="https://helyanaraujo.github.io/admotos-links/og.png">
<meta name="theme-color" content="#05070D">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,300..800&display=swap">
<style>
/* Conceito: painel TFT de moto. Conta-giros em arco no topo com a marca no centro,
   luzes indicadoras na barra de status e cada loja como um "modo" do painel. */
:root {
  --azul: #002C8F;
  --azul-vivo: #2F6BFF;      /* derivado do azul da marca para brilhar no escuro */
  --azul-gelo: #A9C1FF;
  --vermelho: #E92525;
  --vermelho-vivo: #FF4545;
  --verde-zap: #1FAF5A;
  --verde-luz: #3BE27A;
  --fundo: #05070D;
  --vidro: rgba(16, 26, 54, .55);
  --linha: rgba(120, 150, 255, .16);
  --texto: #EEF2FF;
  --suave: #9AA7CC;
  --apagado: #4A5574;
  --f: "Saira", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { background: var(--fundo); }
body {
  min-height: 100vh; min-height: 100dvh;
  background: var(--fundo); color: var(--texto);
  font: 400 16px/1.45 var(--f); font-stretch: 100%;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

/* ---------- fundo: brilho do painel, grade fina e vinheta ---------- */
.fundo { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.fundo::before {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 90% 38% at 50% 0%, rgba(30, 80, 255, .30), transparent 70%),
    radial-gradient(ellipse 70% 30% at 50% 102%, rgba(233, 37, 37, .12), transparent 70%),
    radial-gradient(ellipse 120% 80% at 50% 40%, transparent 55%, rgba(0, 0, 0, .55));
}
.fundo::after {
  content: ""; position: absolute; inset: 0; opacity: .5;
  background-image:
    linear-gradient(rgba(120, 150, 255, .06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120, 150, 255, .06) 1px, transparent 1px);
  background-size: 28px 28px;
  -webkit-mask-image: radial-gradient(ellipse 80% 45% at 50% 18%, #000 20%, transparent 75%);
          mask-image: radial-gradient(ellipse 80% 45% at 50% 18%, #000 20%, transparent 75%);
}

.pagina {
  position: relative; z-index: 1; max-width: 460px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
}

/* ---------- barra de status com luzes indicadoras ---------- */
.status {
  display: grid; grid-template-columns: auto auto 1fr auto auto; align-items: center; gap: 10px;
  height: 34px; padding: 0 4px; color: var(--apagado);
}
.luz { width: 26px; height: 22px; display: grid; place-items: center; transition: color .15s, filter .15s; }
.luz svg { width: 100%; height: 100%; display: block; }
.luz.seta-esq, .luz.seta-dir { width: 24px; }
.luz.on.seta-esq, .luz.on.seta-dir, .luz.on.farol { color: var(--verde-luz); filter: drop-shadow(0 0 6px rgba(59, 226, 122, .75)); }
.luz.on.alto { color: #4F8BFF; filter: drop-shadow(0 0 6px rgba(79, 139, 255, .85)); }
.pisca { animation: pisca .66s steps(1, end) 4; }
@keyframes pisca { 0% { color: var(--verde-luz); filter: drop-shadow(0 0 6px rgba(59, 226, 122, .75)); } 50% { color: var(--apagado); filter: none; } }
.relogio {
  justify-self: center; font-size: 15px; font-weight: 600; font-stretch: 85%; letter-spacing: .08em; color: var(--suave);
}

/* ---------- conta-giros ---------- */
.giro { position: relative; margin: 2px auto 0; width: 100%; max-width: 400px; aspect-ratio: 340 / 252; cursor: pointer; user-select: none; }
.giro svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.giro .numeros text {
  font-family: var(--f); font-size: 13.5px; font-weight: 600; font-stretch: 80%;
  fill: #5D6A8E; text-anchor: middle; dominant-baseline: central; transition: fill .2s;
}
.giro .numeros text.aceso { fill: #DCE5FF; }
.giro .numeros text.verm { fill: #B5303A; }
.giro .numeros text.verm.aceso { fill: #FF6B6B; }
.marca {
  position: absolute; left: 0; right: 0; top: 29.5%;
  display: flex; flex-direction: column; align-items: center; margin: 0;
}
.simbolo {
  width: 15.5%; aspect-ratio: 1; border-radius: 50%; background: #fff; display: grid; place-items: center;
  box-shadow: 0 0 0 3px rgba(255, 255, 255, .06), 0 0 0 7px rgba(47, 107, 255, .12), 0 0 34px rgba(47, 107, 255, .45);
}
.simbolo img { width: 66%; height: auto; display: block; transform: translate(-3%, -1%); }
.letreiro { width: 42%; height: auto; display: block; margin-top: 5.5%; }
.leitura {
  position: absolute; left: 0; right: 0; top: 77%; text-align: center; line-height: 1;
}
.leitura b {
  display: block; font-size: clamp(26px, 8vw, 34px); font-weight: 700; font-stretch: 78%; letter-spacing: .02em; color: #fff;
}
.leitura small {
  display: block; margin-top: 3px; font-size: 10.5px; font-weight: 600; letter-spacing: .28em; color: var(--suave);
}

.chamada { text-align: center; margin: 10px 0 0; }
.chamada strong {
  display: block; font-size: 21px; font-weight: 600; font-stretch: 92%; line-height: 1.2; letter-spacing: .005em; text-wrap: balance;
}
.chamada span { display: block; margin-top: 4px; color: var(--suave); font-size: 15px; }

.rotulo {
  display: flex; align-items: center; gap: 12px; margin: 22px 2px 12px;
  font-size: 11.5px; font-weight: 600; letter-spacing: .26em; color: var(--suave); text-transform: uppercase;
}
.rotulo::before, .rotulo::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg, transparent, var(--linha)); }
.rotulo::after { background: linear-gradient(90deg, var(--linha), transparent); }

/* ---------- cada loja = um modo do painel ---------- */
.modos { display: grid; gap: 14px; }
.modo {
  position: relative; padding: 16px; border-radius: 20px;
  background: linear-gradient(180deg, rgba(22, 36, 76, .62), rgba(8, 12, 26, .78));
  border: 1px solid var(--linha);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 18px 40px -22px rgba(0, 0, 0, .9);
  display: grid; gap: 12px; overflow: hidden;
}
.modo::before { /* filete vermelho no canto, como o marcador ativo do TFT */
  content: ""; position: absolute; left: 16px; top: 0; width: 44px; height: 2px; border-radius: 0 0 2px 2px;
  background: var(--vermelho); box-shadow: 0 0 12px rgba(233, 37, 37, .9);
}
.modo-topo { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.modo-num { display: flex; align-items: baseline; gap: 8px; color: var(--suave); }
.modo-num small { font-size: 11px; font-weight: 600; letter-spacing: .26em; }
.modo-num b { font-size: 22px; font-weight: 700; font-stretch: 78%; color: #fff; line-height: 1; }
.selo {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #FFD0D0;
  background: rgba(233, 37, 37, .12); border: 1px solid rgba(233, 37, 37, .35);
}
.selo i { width: 6px; height: 6px; border-radius: 50%; background: var(--vermelho-vivo); box-shadow: 0 0 8px var(--vermelho-vivo); }
.modo h2 {
  margin: -2px 0 0; font-size: 31px; line-height: 1; font-weight: 700; font-stretch: 74%; letter-spacing: .01em; text-transform: uppercase;
}
.endereco { margin: -4px 0 0; display: flex; align-items: center; gap: 7px; color: var(--suave); font-size: 14.5px; }
.endereco svg { flex: none; color: var(--vermelho-vivo); }

/* botões = teclas do painel */
.tecla {
  -webkit-appearance: none; appearance: none; font: inherit; color: inherit; cursor: pointer; text-decoration: none;
  display: flex; align-items: center; gap: 12px; border-radius: 14px; position: relative;
  transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease, background-color .2s ease;
}
.tecla:active { transform: translateY(1px) scale(.985); }
.tecla:focus-visible, .giro:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.zap {
  min-height: 66px; padding: 10px 14px 10px 10px; color: #fff;
  background: linear-gradient(180deg, #0D44DA 0%, #0234B4 50%, var(--azul) 100%);
  border: 1px solid rgba(150, 180, 255, .55);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 0 0 1px rgba(0, 0, 0, .35), 0 12px 30px -10px rgba(47, 107, 255, .75);
}
.zap:hover { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 0 0 1px rgba(0, 0, 0, .35), 0 14px 38px -8px rgba(47, 107, 255, .95); }
.zap .bolinha {
  flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center;
  background: var(--verde-zap); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 0 16px rgba(31, 175, 90, .45);
}
.zap .bolinha svg { width: 27px; height: 27px; }
.zap .txt { flex: 1; min-width: 0; display: grid; gap: 1px; }
.zap .txt strong { font-size: 17.5px; font-weight: 600; line-height: 1.15; }
.zap .txt span { font-size: 16px; font-weight: 500; font-stretch: 88%; letter-spacing: .03em; color: #D3E0FF; line-height: 1.2; }
.seta { flex: none; opacity: .9; }

.par { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.sec {
  min-height: 52px; padding: 8px 12px; justify-content: center; gap: 9px;
  font-size: 15px; font-weight: 500; color: var(--texto);
  background: rgba(255, 255, 255, .035); border: 1px solid rgba(160, 180, 255, .16);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
}
.sec svg { width: 20px; height: 20px; flex: none; }
.sec.mapa svg { color: #6E9BFF; }
.sec.copiar svg { color: var(--vermelho-vivo); }
.sec:hover { border-color: rgba(160, 185, 255, .38); background: rgba(255, 255, 255, .06); }
.sec.mapa:hover { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 0 22px -6px rgba(47, 107, 255, .7); }
.sec.copiar:hover { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 0 22px -6px rgba(233, 37, 37, .7); }

/* ---------- teclas de função (rodapé do painel) ---------- */
.funcoes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fn {
  flex-direction: column; justify-content: center; gap: 7px; min-height: 86px; padding: 12px 6px 10px;
  text-align: center; font-size: 13.5px; font-weight: 500; line-height: 1.15; color: var(--texto);
  background: linear-gradient(180deg, rgba(22, 36, 76, .5), rgba(8, 12, 26, .7));
  border: 1px solid var(--linha); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
}
.fn .ic {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: #8FB0FF;
  background: rgba(47, 107, 255, .12); border: 1px solid rgba(47, 107, 255, .3);
}
.fn .ic svg { width: 20px; height: 20px; }
.fn > span:last-child { min-height: 2.3em; display: flex; align-items: center; justify-content: center; }
.fn:nth-child(2) .ic { color: #FF8080; background: rgba(233, 37, 37, .1); border-color: rgba(233, 37, 37, .32); }
.fn:hover { border-color: rgba(160, 185, 255, .36); }

.rodape {
  margin: 26px 0 0; text-align: center; color: #6F7BA0; font-size: 12.5px; line-height: 1.6;
}
.rodape b { font-weight: 600; letter-spacing: .2em; font-size: 11px; color: var(--suave); }

/* ---------- aviso (toast) ---------- */
.aviso {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); z-index: 10;
  transform: translate(-50%, 140%); opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: 10px; padding: 11px 16px 11px 12px; border-radius: 14px;
  background: #0A1022; border: 1px solid rgba(120, 150, 255, .35); color: #fff;
  font-size: 15px; font-weight: 500; white-space: nowrap;
  box-shadow: 0 14px 34px rgba(0, 0, 0, .6), 0 0 24px -6px rgba(47, 107, 255, .7);
  transition: transform .28s cubic-bezier(.2, .9, .3, 1.2), opacity .2s;
}
.aviso i { width: 8px; height: 8px; border-radius: 50%; background: var(--verde-luz); box-shadow: 0 0 10px var(--verde-luz); }
.aviso.ver { transform: translate(-50%, 0); opacity: 1; }

/* entrada: só deslocamento curto + opacidade que já começa visível */
@keyframes sobe { from { transform: translateY(10px); opacity: .35; } to { transform: none; opacity: 1; } }
.entra { animation: sobe .6s cubic-bezier(.2, .7, .2, 1) both; }

@media (min-width: 720px) {
  .pagina { padding-top: 34px; }
  .modo h2 { font-size: 33px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div class="fundo" aria-hidden="true"></div>

<main class="pagina">
  <div class="status" aria-hidden="true">
    <span class="luz seta-esq" id="l-esq"><svg viewBox="0 0 24 20"><path fill="currentColor" d="M1 10 11 1v5.5h12v7H11V19Z"/></svg></span>
    <span class="luz farol" id="l-farol"><svg viewBox="0 0 28 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 3c5.5 0 9 3.4 9 8s-3.5 8-9 8c-1.2 0-1.8-.5-1.8-1.6V4.6C13.2 3.5 13.8 3 15 3Z"/><path d="m3 6 7 1.8M3 11l7 1.8M3 16l7 1.8"/></svg></span>
    <span class="relogio num" id="relogio">--:--</span>
    <span class="luz alto" id="l-alto"><svg viewBox="0 0 28 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 3c5.5 0 9 3.4 9 8s-3.5 8-9 8c-1.2 0-1.8-.5-1.8-1.6V4.6C13.2 3.5 13.8 3 15 3Z"/><path d="M3 6h7M3 11h7M3 16h7"/></svg></span>
    <span class="luz seta-dir" id="l-dir"><svg viewBox="0 0 24 20"><path fill="currentColor" d="M23 10 13 1v5.5H1v7h12V19Z"/></svg></span>
  </div>

  <div class="giro entra" id="giro" title="Toque para acelerar">
    <svg viewBox="0 0 340 252" aria-hidden="true">
      <defs>
        <linearGradient id="g-azul" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#0A2E9E"/><stop offset=".55" stop-color="#2F6BFF"/><stop offset="1" stop-color="#9DB8FF"/>
        </linearGradient>
        <linearGradient id="g-agulha" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#E92525" stop-opacity=".2"/><stop offset=".5" stop-color="#FF4545"/><stop offset="1" stop-color="#FFB3B3"/>
        </linearGradient>
        <filter id="brilho" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="g-miolo" cx=".5" cy=".55" r=".5">
          <stop offset="0" stop-color="#14235A" stop-opacity=".85"/><stop offset="1" stop-color="#05070D" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="170" cy="160" r="118" fill="url(#g-miolo)"/>
      <path id="aro" fill="none" stroke="rgba(140,165,255,.14)" stroke-width="1"/>
      <path id="trilho" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="9" stroke-linecap="butt"/>
      <path id="faixa-verm" fill="none" stroke="#E92525" stroke-opacity=".45" stroke-width="3"/>
      <path id="arco" fill="none" stroke="url(#g-azul)" stroke-width="9" pathLength="100" stroke-dasharray="0 100" filter="url(#brilho)"/>
      <path id="arco-verm" fill="none" stroke="#FF3B3B" stroke-width="9" pathLength="100" stroke-dasharray="0 100" filter="url(#brilho)"/>
      <g id="riscos"></g>
      <g id="numeros" class="numeros"></g>
      <g id="agulha" filter="url(#brilho)">
        <path d="M168 76 169.4 18h1.2L172 76Z" fill="url(#g-agulha)"/>
      </g>
    </svg>
    <h1 class="marca">
      <span class="simbolo"><img src="favicon.svg" alt=""></span>
      <img class="letreiro" src="letreiro-branco.svg" alt="AD Motos" width="500" height="100">
    </h1>
    <div class="leitura" aria-hidden="true"><b class="num" id="rpm">0</b><small>R/MIN</small></div>
  </div>

  <p class="chamada entra" style="animation-delay:.08s">
    <strong>Peças e acessórios para a sua moto</strong>
    <span>Escolha a loja e fale com a gente no WhatsApp</span>
  </p>

  <div class="rotulo" aria-hidden="true">Lojas</div>
  <div class="modos" id="modos"></div>

  <div class="rotulo" aria-hidden="true">Funções</div>
  <div class="funcoes" id="funcoes"></div>

  <p class="rodape" id="rodape"><b>AD MOTOS</b></p>
</main>

<div class="aviso" id="aviso" role="status" aria-live="polite"><i aria-hidden="true"></i><span id="aviso-txt"></span></div>

<script src="config.js?v=20261123b"></script>
<script src="links.js?v=20261123b"></script>
<script src="icones.js?v=20261123b"></script>
<script>
(function () {
  var reduzir = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- ícones extras (desenhados aqui) ---------------- */
  var IC = {
    copiar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2.5"/><path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-7A2.5 2.5 0 0 0 4 5.5v8A2.5 2.5 0 0 0 6.5 16H8"/></svg>',
    contato: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2.5 20.5c.8-3.8 3.8-6 7.5-6 1.6 0 3 .4 4.2 1.1M18.5 14v7M15 17.5h7"/></svg>',
    compartilhar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5"/><path d="M8 11H6.5A2.5 2.5 0 0 0 4 13.5v5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5v-5a2.5 2.5 0 0 0-2.5-2.5H16"/></svg>'
  };

  /* ---------------- lojas (modos) a partir de LOJAS ---------------- */
  var lojas = window.LOJAS || [];
  var html = "";
  lojas.forEach(function (loja, i) {
    var zap = loja.links.filter(function (l) { return l.tipo === "zap"; })[0];
    var mapa = loja.links.filter(function (l) { return l.tipo === "mapa"; })[0];
    var chave = zap ? zap.id.replace(/^zap-/, "") : String(i + 1);
    var n = String(i + 1).padStart(2, "0");
    html += '<section class="modo entra" style="animation-delay:' + (0.14 + i * 0.08) + 's" aria-labelledby="loja-' + i + '">' +
      '<div class="modo-topo"><span class="modo-num"><small>MODO</small><b class="num">' + n + '</b></span>' +
      (loja.detalhe ? '<span class="selo"><i aria-hidden="true"></i>' + esc(loja.detalhe) + '</span>' : '') + '</div>' +
      '<h2 id="loja-' + i + '">' + esc(loja.nome) + '</h2>' +
      (loja.endereco ? '<p class="endereco">' + ICO.pino + '<span>' + esc(loja.endereco) + '</span></p>' : '');
    if (zap) {
      html += '<a class="tecla zap" data-id="' + esc(zap.id) + '" href="' + esc(zap.url) + '"' + alvo(zap.url) +
        ' aria-label="' + esc(zap.titulo + " da loja " + loja.nome + (zap.sub ? ", " + zap.sub : "")) + '">' +
        '<span class="bolinha">' + ICO.zap + '</span>' +
        '<span class="txt"><strong>' + esc(zap.titulo) + '</strong>' + (zap.sub ? '<span class="num">' + esc(zap.sub) + '</span>' : '') + '</span>' +
        SETA + '</a>';
    }
    html += '<div class="par">';
    if (mapa) {
      html += '<a class="tecla sec mapa" data-id="' + esc(mapa.id) + '" href="' + esc(mapa.url) + '"' + alvo(mapa.url) +
        ' aria-label="' + esc(mapa.titulo + " até a loja " + loja.nome) + '">' + ICO.mapa + '<span>' + esc(mapa.titulo) + '</span></a>';
    }
    if (zap && zap.sub) {
      html += '<button type="button" class="tecla sec copiar" data-id="copiar-' + esc(chave) + '" data-numero="' + esc(zap.sub) + '"' +
        ' aria-label="Copiar número da loja ' + esc(loja.nome) + '">' + IC.copiar + '<span>Copiar número</span></button>';
    }
    html += '</div></section>';
  });
  $("modos").innerHTML = html;

  /* ---------------- teclas de função ---------------- */
  var fn = '<a class="tecla fn entra" style="animation-delay:.3s" href="admotos.vcf" data-id="salvar-contato" download><span class="ic">' + IC.contato + '</span><span>Salvar contato</span></a>' +
    '<button type="button" class="tecla fn entra" style="animation-delay:.34s" data-id="compartilhar" id="compartilhar"><span class="ic">' + IC.compartilhar + '</span><span>Compartilhar</span></button>';
  (window.OUTROS || []).forEach(function (o, i) {
    var ic = ICO[o.tipo] || ICO.site;
    fn += '<a class="tecla fn entra" style="animation-delay:' + (0.38 + i * 0.04) + 's" data-id="' + esc(o.id) + '" href="' + esc(o.url) + '"' + alvo(o.url) +
      (o.sub ? ' aria-label="' + esc(o.titulo + ": " + o.sub) + '"' : '') + '><span class="ic">' + ic + '</span><span>' + esc(o.titulo) + '</span></a>';
  });
  $("funcoes").innerHTML = fn;

  var emails = (window.OUTROS || []).filter(function (o) { return o.tipo === "email" && o.sub; });
  $("rodape").innerHTML = '<b>AD MOTOS</b><br>' + lojas.map(function (l) { return esc(l.nome); }).join(" · ") + ' · BA' +
    (emails.length ? '<br>' + esc(emails[0].sub) : '');

  /* ---------------- aviso ---------------- */
  var tAviso;
  function avisar(txt) {
    $("aviso-txt").textContent = txt;
    $("aviso").classList.add("ver");
    clearTimeout(tAviso);
    tAviso = setTimeout(function () { $("aviso").classList.remove("ver"); }, 2200);
  }
  function copiar(txt) {
    function reserva() {
      var t = document.createElement("textarea");
      t.value = txt; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.top = "0"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      t.remove(); return Promise.resolve(ok);
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(txt).then(function () { return true; }, reserva);
    }
    return reserva();
  }
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("button.copiar");
    if (!b) return;
    copiar(b.dataset.numero).then(function (ok) { avisar(ok ? "Número copiado: " + b.dataset.numero : "Não deu para copiar. Número: " + b.dataset.numero); });
    blip(3.2);
  });
  $("compartilhar").addEventListener("click", function () {
    var url = location.href.split("#")[0];
    if (navigator.share) {
      navigator.share({ title: "AD Motos", text: "Peças e acessórios para a sua moto", url: url }).catch(function () {});
    } else {
      copiar(url).then(function (ok) { avisar(ok ? "Link copiado" : "Não deu para copiar o link"); });
    }
  });

  /* ---------------- relógio da barra de status ---------------- */
  function hora() {
    var d = new Date();
    $("relogio").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  hora(); setInterval(hora, 15000);

  /* ---------------- conta-giros ---------------- */
  var CX = 170, CY = 160, R = 140, MAX = 12, VERM = 10, A0 = -125, A1 = 125, REPOUSO = 1.4;
  var NS = "http://www.w3.org/2000/svg";
  function ang(v) { return A0 + (v / MAX) * (A1 - A0); }
  function pt(a, r) { var t = a * Math.PI / 180; return [CX + r * Math.sin(t), CY - r * Math.cos(t)]; }
  function arco(a1, a2, r) {
    var p = pt(a1, r), q = pt(a2, r);
    return "M" + p[0].toFixed(2) + " " + p[1].toFixed(2) + " A" + r + " " + r + " 0 " + (a2 - a1 > 180 ? 1 : 0) + " 1 " + q[0].toFixed(2) + " " + q[1].toFixed(2);
  }
  $("aro").setAttribute("d", arco(A0 - 4, A1 + 4, 151));
  $("trilho").setAttribute("d", arco(A0, A1, R));
  $("faixa-verm").setAttribute("d", arco(ang(VERM), A1, 150));
  $("arco").setAttribute("d", arco(A0, ang(VERM), R));
  $("arco-verm").setAttribute("d", arco(ang(VERM), A1, R));

  var riscos = [], numeros = [];
  for (var v = 0; v <= MAX + 0.001; v += 0.5) {
    var maior = Math.abs(v - Math.round(v)) < 0.01;
    var a = ang(v), p1 = pt(a, 129), p2 = pt(a, maior ? 116 : 123);
    var l = document.createElementNS(NS, "line");
    l.setAttribute("x1", p1[0].toFixed(2)); l.setAttribute("y1", p1[1].toFixed(2));
    l.setAttribute("x2", p2[0].toFixed(2)); l.setAttribute("y2", p2[1].toFixed(2));
    l.setAttribute("stroke-width", maior ? 2.2 : 1.3);
    l.setAttribute("stroke-linecap", "round");
    l._v = v; l._verm = v >= VERM; l.setAttribute("stroke", l._verm ? "#8E2630" : "#3A4566");
    $("riscos").appendChild(l); riscos.push(l);
    if (maior) {
      var pn = pt(a, 104), t = document.createElementNS(NS, "text");
      t.setAttribute("x", pn[0].toFixed(2)); t.setAttribute("y", pn[1].toFixed(2));
      t.textContent = Math.round(v);
      if (v >= VERM) t.classList.add("verm");
      t._v = v; $("numeros").appendChild(t); numeros.push(t);
    }
  }

  var atual = 0;
  function mostrar(val) {
    atual = val;
    $("agulha").setAttribute("transform", "rotate(" + ang(val).toFixed(2) + " " + CX + " " + CY + ")");
    var azul = Math.min(val, VERM) / VERM * 100, verm = Math.max(0, val - VERM) / (MAX - VERM) * 100;
    $("arco").setAttribute("stroke-dasharray", azul.toFixed(2) + " 100");
    $("arco-verm").setAttribute("stroke-dasharray", verm.toFixed(2) + " 100");
    riscos.forEach(function (r) {
      var on = r._v <= val + 0.01;
      r.setAttribute("stroke", on ? (r._verm ? "#FF5A5A" : "#C9D7FF") : (r._verm ? "#8E2630" : "#3A4566"));
    });
    numeros.forEach(function (t) { t.classList.toggle("aceso", t._v <= val + 0.01); });
    $("rpm").textContent = (Math.round(val * 10) * 100).toLocaleString("pt-BR");
  }

  var easeOut = function (x) { return 1 - Math.pow(1 - x, 3); };
  var easeInOut = function (x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  var anim = 0;
  function animar(etapas) {
    var id = ++anim, i = 0, ini = null, de = atual;
    function passo(ts) {
      if (id !== anim) return;
      var e = etapas[i];
      if (ini === null) { ini = ts; de = atual; }
      var x = Math.min(1, (ts - ini) / e.ms);
      mostrar(de + (e.para - de) * (e.ease || easeInOut)(x));
      if (x >= 1) {
        if (e.fim) e.fim();
        i++; ini = null;
        if (i >= etapas.length) return;
      }
      requestAnimationFrame(passo);
    }
    requestAnimationFrame(passo);
  }

  var luzes = ["l-esq", "l-farol", "l-alto", "l-dir"];
  function luz(id, on) { $(id).classList.toggle("on", on); }

  function partida() {
    luzes.forEach(function (id) { luz(id, true); });
    animar([
      { para: 0, ms: 140 },
      { para: MAX, ms: 560, ease: easeOut, fim: function () { luzes.forEach(function (id) { luz(id, id === "l-farol"); }); } },
      { para: MAX, ms: 60 },
      { para: REPOUSO, ms: 680, ease: easeInOut }
    ]);
  }
  function blip(alto) {
    if (reduzir) return;
    animar([{ para: alto, ms: 160, ease: easeOut }, { para: REPOUSO, ms: 520, ease: easeInOut }]);
  }

  if (reduzir) {
    mostrar(REPOUSO); luz("l-farol", true);
  } else {
    mostrar(0); partida();
    $("giro").addEventListener("click", partida);
    document.addEventListener("pointerdown", function (ev) {
      if (ev.target.closest(".zap")) blip(5.5);
    });
    // seta pisca ao apontar para "Como chegar"
    var pisca = function (ev) {
      if (!ev.target.closest || !ev.target.closest(".mapa")) return;
      var s = $("l-dir"); s.classList.remove("pisca"); void s.offsetWidth; s.classList.add("pisca");
    };
    document.addEventListener("pointerover", pisca);
    document.addEventListener("focusin", pisca);
    $("l-dir").addEventListener("animationend", function () { this.classList.remove("pisca"); });
  }
})();
</script>
