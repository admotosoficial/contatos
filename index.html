<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AD Motos</title>
<meta name="description" content="Peças e acessórios para a sua moto em Capim Grosso, Senhor do Bonfim e Várzea da Roça (BA). Lojas, atacado, garantia e financeiro pelo WhatsApp.">
<meta name="theme-color" content="#F5F5F7">
<meta property="og:title" content="AD Motos">
<meta property="og:description" content="Peças e acessórios para a sua moto. Fale com a loja pelo WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://helyanaraujo.github.io/admotos-links/og.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Vitrine clara · estilo Apple: papel quase branco, manchete enorme, cartões grandes com sombras em camadas,
   azul da marca nos detalhes e um único acento vermelho (o ponto final da manchete). */
:root {
  --azul: #002C8F; --azul-2: #1D4FD1; --azul-claro: #E9EFFC; --azul-tinta: #0A1A4A;
  --vermelho: #E92525; --verde: #1FAF5A; --verde-2: #16984C;
  --papel: #F5F5F7; --cartao: #FFFFFF; --tinta: #0B0D17; --suave: #5E6273; --linha: rgba(10, 20, 60, .08);
  --sombra: 0 1px 1px rgba(10, 22, 70, .04), 0 4px 10px rgba(10, 22, 70, .05), 0 18px 40px -12px rgba(10, 22, 70, .14);
  --sombra-alta: 0 1px 1px rgba(10, 22, 70, .05), 0 8px 20px rgba(10, 22, 70, .08), 0 30px 60px -18px rgba(10, 22, 70, .24);
  --mola: cubic-bezier(.2, .9, .25, 1.15); --suave-ease: cubic-bezier(.2, .8, .2, 1);
  --disp: "Inter Tight", "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif;
  --txt: "Inter", "SF Pro Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gx: max(20px, env(safe-area-inset-left, 0px)); --gxr: max(20px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  background: var(--papel); color: var(--tinta); font: 400 16px/1.5 var(--txt);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: hidden;
  padding-bottom: calc(108px + env(safe-area-inset-bottom, 0px));
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a, button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--azul-2); outline-offset: 3px; border-radius: 14px; }
#escolha-titulo:focus, #escolha-titulo:focus-visible { outline: none; } /* a janela abre com o foco no título, sem nenhuma opção marcada */
svg { flex: none; }

.pg { max-width: 1120px; margin: 0 auto; padding: 0 var(--gxr) 0 var(--gx); }

/* ---------- topo ---------- */
.topo { display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 18px); }
.topo .logo { display: block; width: 132px; height: auto; }
.redondo { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
  background: var(--cartao); color: var(--azul); box-shadow: var(--sombra); }
.redondo svg { width: 19px; height: 19px; }

/* ---------- manchete ---------- */
.hero { padding: 30px 0 24px; }
.olho { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 18px; font: 600 13px/1 var(--txt);
  letter-spacing: .02em; color: var(--azul); background: var(--azul-claro); padding: 8px 12px 8px 10px; border-radius: 999px; }
.olho i { width: 7px; height: 7px; border-radius: 50%; background: var(--azul); box-shadow: 0 0 0 4px rgba(0, 44, 143, .12); }
h1 { margin: 0; font: 800 clamp(52px, 14.4vw, 120px)/.94 var(--disp); letter-spacing: -.048em; color: var(--tinta); }
h1 .l { display: block; }
h1 .grad { background: linear-gradient(100deg, var(--azul) 10%, var(--azul-2) 70%, #3E6BEA 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .06em; }
h1 .ponto { color: var(--vermelho); display: inline-block; -webkit-text-fill-color: var(--vermelho); }
.lead { margin: 18px 0 0; max-width: 30ch; font: 400 19px/1.45 var(--txt); color: var(--suave); letter-spacing: -.01em; }
.lead b { color: var(--tinta); font-weight: 600; }

/* ---------- rótulos de seção ---------- */
.secao { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 18px 2px 14px; }
.secao h2 { margin: 0; font: 700 22px/1.2 var(--disp); letter-spacing: -.02em; }
.secao span { font: 500 14px/1.3 var(--txt); color: var(--suave); text-align: right; }
.secao.grande { margin-top: 40px; }
/* complemento do nome, ex.: "Atacado (Matriz)" */
.ext { font-size: .62em; font-weight: 600; letter-spacing: -.01em; color: var(--suave); white-space: nowrap; }
.secao h2 .ext { font: 600 .55em/1 var(--disp); text-align: left; }
.secao:has(h2 .ext) { flex-wrap: wrap; row-gap: 2px; }
.secao h2:has(.ext) { white-space: nowrap; }
.secao:has(h2 .ext) > span:not(.ext) { text-align: left; }
.secao.grande h2 { font-size: 30px; letter-spacing: -.035em; }

/* ---------- acesso rápido ---------- */
.rapido { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 8px; }
.atalho { position: relative; display: grid; gap: 14px; padding: 16px 16px 15px; border-radius: 24px; background: var(--cartao); box-shadow: var(--sombra); }
.atalho .ic { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; background: var(--azul-claro); color: var(--azul); }
.atalho .ic svg { width: 24px; height: 24px; }
.atalho .t { display: grid; gap: 2px; min-width: 0; }
.atalho b { font: 700 19px/1.1 var(--disp); letter-spacing: -.025em; }
.atalho small { font: 500 13px/1.25 var(--txt); color: var(--suave); }
.atalho .desce { position: absolute; top: 16px; right: 14px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--papel); color: #8E93A3; transition: transform .35s var(--mola), background-color .25s, color .25s; }
.atalho .desce svg { width: 15px; height: 15px; }
.atalho:first-child .ic { background: var(--azul); color: #fff; }
.alvo { scroll-margin-top: 18px; }

/* ---------- lojas ---------- */
.lojas, .canais { display: grid; gap: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.loja { position: relative; isolation: isolate; overflow: hidden; background: var(--cartao); border-radius: 24px;
  padding: 18px 16px 16px; box-shadow: var(--sombra); transition: box-shadow .4s var(--suave-ease), transform .4s var(--suave-ease); }
.loja::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .35s;
  background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), rgba(29, 79, 209, .07), transparent 60%); }
.radar { position: absolute; right: -44px; top: -44px; width: 160px; height: 160px; z-index: -1; color: var(--azul); pointer-events: none; }
.radar circle { fill: none; stroke: currentColor; }
.radar .r1 { opacity: .10; } .radar .r2 { opacity: .07; } .radar .r3 { opacity: .045; }
.radar .nucleo { fill: currentColor; stroke: none; opacity: .9; }
.radar .halo { fill: currentColor; stroke: none; opacity: 0; transform-origin: 105px 105px; }
.radar .glifo { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.canal .cidade { margin-top: 10px; }
.canal .end { margin-bottom: 14px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--txt); letter-spacing: .08em; text-transform: uppercase;
  color: var(--azul); background: var(--azul-claro); padding: 7px 10px; border-radius: 999px; }
.cidade { margin: 12px 0 6px; font: 800 clamp(26px, 7.2vw, 38px)/1.05 var(--disp); letter-spacing: -.04em; text-wrap: balance; color: var(--tinta); }
.end { display: flex; align-items: center; gap: 7px; margin: 0 0 14px; font: 400 14px/1.35 var(--txt); color: var(--suave); }
.end svg { color: var(--azul); }

.zap { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 16px;
  background: linear-gradient(180deg, #22B862, var(--verde) 60%, #1BA453); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 1px 2px rgba(10, 90, 40, .25), 0 10px 24px -8px rgba(22, 152, 76, .55); }
.zap .bola { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, .18); }
.zap .bola svg { width: 22px; height: 22px; }
.zap .t { display: grid; gap: 1px; min-width: 0; }
.zap .t b { font: 600 16px/1.2 var(--txt); letter-spacing: -.01em; }
.zap .t small { font: 500 13px/1.2 var(--txt); opacity: .9; font-variant-numeric: tabular-nums; }
.zap .seta { margin-left: auto; opacity: .9; transition: transform .35s var(--mola); }
.zap.site { background: linear-gradient(180deg, #1F4FC9, var(--azul-2) 45%, var(--azul)); 
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 1px 2px rgba(0, 30, 100, .3), 0 10px 24px -8px rgba(0, 44, 143, .55); }
.zap.site .bola .ico { width: 25px; height: 25px; }
.uma { display: grid; margin-top: 8px; }

.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.sec { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 8px 8px; border-radius: 14px; white-space: nowrap;
  background: var(--papel); color: var(--azul); font: 600 14.5px/1.2 var(--txt); letter-spacing: -.01em; text-align: center; }
.sec svg, .sec .ico { width: 18px; height: 18px; }

/* ---------- ações ---------- */
.acoes { display: grid; background: var(--cartao); border-radius: 26px; box-shadow: var(--sombra); overflow: hidden; }
.acao { display: flex; align-items: center; gap: 14px; padding: 15px 18px; min-height: 70px; text-align: left; width: 100%; position: relative; }
.acao + .acao::before { content: ""; position: absolute; top: 0; left: 72px; right: 0; height: 1px; background: var(--linha); }
.acao .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--azul-claro); color: var(--azul); }
.acao .ic svg, .acao .ic .ico { width: 20px; height: 20px; }
.acao .t { display: grid; gap: 1px; min-width: 0; }
.acao .t b { font: 600 16px/1.25 var(--txt); letter-spacing: -.01em; }
.acao .t small { font: 400 14px/1.3 var(--txt); color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acao .seta { margin-left: auto; color: #B3B7C4; transition: transform .35s var(--mola); }

/* ---------- rodapé ---------- */
.rodape { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 44px 0 8px; text-align: center; color: var(--suave); font-size: 13px; }
.rodape img { width: 30px; height: 30px; }

/* ---------- barra flutuante ---------- */
.barra { position: fixed; z-index: 20; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  width: min(460px, calc(100% - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  transform: translateX(-50%); padding: 7px; border-radius: 26px;
  background: rgba(255, 255, 255, .72); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 0 0 1px rgba(10, 22, 70, .06), 0 12px 34px -8px rgba(10, 22, 70, .28); transition: transform .45s var(--suave-ease), opacity .3s; }
.barra .zap { width: 100%; justify-content: center; padding: 15px 18px; border-radius: 20px; font: 600 17px/1 var(--txt); letter-spacing: -.01em; }
.barra .zap svg { width: 24px; height: 24px; }
body.folha-aberta .barra { transform: translate(-50%, 140%); opacity: 0; }

/* ---------- folha (bottom sheet) ---------- */
dialog.folha { position: fixed; inset: auto 0 0 0; margin: 0 auto; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain; border: 0;
  padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(20px, env(safe-area-inset-left, 0px));
  border-radius: 30px 30px 0 0; background: var(--cartao); color: var(--tinta); box-shadow: 0 -20px 60px -10px rgba(10, 22, 70, .3); }
dialog.folha[open] { animation: subir .5s var(--suave-ease); }
dialog.folha.fechando { animation: descer .28s ease-in forwards; }
dialog.folha::backdrop { background: rgba(8, 12, 30, .34); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fade .4s ease; }
dialog.folha.fechando::backdrop { animation: fade .28s ease reverse forwards; }
.alca { width: 38px; height: 5px; border-radius: 3px; background: #D9DBE3; margin: 0 auto 18px; }
.folha h2 { margin: 0; font: 800 28px/1.1 var(--disp); letter-spacing: -.035em; }
.folha p.sub { margin: 6px 0 18px; color: var(--suave); font-size: 15px; }
.opcoes { display: grid; gap: 8px; }
.grupo-folha { margin: 16px 4px 2px; font: 600 12px/1 var(--txt); letter-spacing: .08em; text-transform: uppercase; color: var(--suave); }
.grupo-folha:first-child { margin-top: 0; }
.opcao { display: flex; align-items: center; gap: 14px; padding: 11px 16px 11px 12px; border-radius: 20px; background: var(--papel); }
.opcao .bola { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--verde); color: #fff;
  box-shadow: 0 6px 14px -6px rgba(22, 152, 76, .7); }
.opcao .bola svg { width: 24px; height: 24px; }
.opcao .bola.site { background: var(--azul); }
.opcao .t { display: grid; gap: 2px; min-width: 0; }
.opcao .t b { font: 700 18px/1.15 var(--disp); letter-spacing: -.02em; }
.opcao .t small { font: 500 14px/1.25 var(--txt); color: var(--suave); font-variant-numeric: tabular-nums; }
.opcao .seta { margin-left: auto; color: #A9AEBD; transition: transform .35s var(--mola); }
.cancelar { display: block; width: 100%; margin-top: 12px; padding: 16px; border-radius: 18px; font: 600 16px/1 var(--txt); color: var(--azul); }

/* ---------- aviso ---------- */
.aviso { position: fixed; z-index: 40; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translate(-50%, 16px) scale(.96);
  display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px 12px 14px; border-radius: 999px; background: rgba(14, 18, 34, .92); color: #fff;
  font: 500 15px/1 var(--txt); white-space: nowrap; box-shadow: 0 12px 30px -8px rgba(0, 0, 0, .4); opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .25s, transform .4s var(--mola), visibility 0s .4s; }
.aviso svg { width: 18px; height: 18px; color: #5BE38F; }
.aviso.ver { opacity: 1; visibility: visible; transform: translate(-50%, 0) scale(1); transition: opacity .2s, transform .45s var(--mola), visibility 0s; }

/* ---------- microinterações ---------- */
.toque { transition: transform .5s var(--mola), box-shadow .3s, background-color .25s, filter .25s; }
.toque:active { transform: scale(.965); transition-duration: .12s; }
.zap.toque:active { filter: brightness(.95); }
.sec.toque:active, .opcao.toque:active { background-color: #ECEDF1; }
.atalho.toque:active .desce { transform: translateY(3px); background: var(--azul-claro); color: var(--azul); }
.acao.toque:active { background-color: #F3F4F7; transform: none; }
.redondo.toque:active { transform: scale(.9); }
@media (hover: hover) and (pointer: fine) {
  .loja:hover, .atalho:hover { box-shadow: var(--sombra-alta); transform: translateY(-3px); }
  .atalho:hover .desce { transform: translateY(3px); background: var(--azul-claro); color: var(--azul); }
  .loja:hover::before { opacity: 1; }
  .zap:hover .seta, .acao:hover .seta, .opcao:hover .seta { transform: translateX(4px); }
  .sec:hover { background: #EDEFF5; }
  .acao:hover { background: #FAFAFC; }
  .opcao:hover { background: #EEEFF3; }
  .redondo:hover { box-shadow: var(--sombra-alta); }
}

/* ---------- entrada e momento especial ---------- */
@keyframes subirTexto { from { opacity: 0; transform: translateY(.32em); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes surgir { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes ponto { 0% { transform: scale(0); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes pulso { 0% { transform: scale(.8); opacity: 0; } 15% { opacity: .22; } 100% { transform: scale(4.2); opacity: 0; } }
@keyframes subir { from { transform: translateY(100%); } to { transform: none; } }
@keyframes descer { to { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes barraIn { from { transform: translate(-50%, 140%); } to { transform: translate(-50%, 0); } }
.anima .topo { animation: fade .6s ease both; }
.anima .olho { animation: subirTexto .6s var(--suave-ease) both .05s; }
.anima h1 .l { animation: subirTexto .75s var(--suave-ease) both; }
.anima h1 .l:nth-child(1) { animation-delay: .1s; } .anima h1 .l:nth-child(2) { animation-delay: .2s; }
.anima h1 .ponto { animation: ponto .55s var(--mola) both .62s; }
.anima .lead { animation: subirTexto .7s var(--suave-ease) both .3s; }
.anima .rapido .atalho { animation: surgir .65s var(--suave-ease) both; }
.anima .rapido .atalho:nth-child(1) { animation-delay: .34s; } .anima .rapido .atalho:nth-child(2) { animation-delay: .40s; }
.anima .rapido .atalho:nth-child(3) { animation-delay: .46s; } .anima .rapido .atalho:nth-child(4) { animation-delay: .52s; }
.anima .lojas .loja { animation: surgir .7s var(--suave-ease) both; }
.anima .lojas .loja:nth-child(1) { animation-delay: .5s; } .anima .lojas .loja:nth-child(2) { animation-delay: .58s; } .anima .lojas .loja:nth-child(3) { animation-delay: .66s; }
.anima .radar .halo { animation: pulso 2.2s ease-out .9s 1 both; }
.anima .barra { animation: barraIn .7s var(--suave-ease) both .5s; }
body.folha-aberta.anima .barra { animation: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .radar .halo { opacity: 0; }
}

/* ---------- computador ---------- */
@media (min-width: 760px) {
  body { padding-bottom: 130px; }
  .pg { padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); }
  .topo { padding-top: 28px; } .topo .logo { width: 150px; }
  .hero { padding: 64px 0 40px; }
  h1 { font-size: clamp(52px, 8.6vw, 104px); }
  .lead { font-size: 22px; max-width: 34ch; }
  .rapido { grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .atalho { padding: 20px; }
  .lojas { grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .canais { grid-template-columns: 1fr 1fr; gap: 22px; }
  .par { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
  .par .canais { grid-template-columns: 1fr; }
  .lojas .cidade { font-size: clamp(26px, 2.6vw, 32px); }
  .lojas .loja { padding: 22px 20px 20px; }
  .lojas .zap { gap: 12px; padding: 12px 14px 12px 12px; }
  .lojas .zap .t b { white-space: nowrap; font-size: 16px; }
  .lojas .zap .bola { width: 40px; height: 40px; border-radius: 13px; }
  .secao.grande { margin-top: 56px; }
  .secao.grande h2 { font-size: 36px; }
  .loja { padding: 34px 32px 30px; border-radius: 34px; }
  .radar { width: 260px; height: 260px; right: -60px; top: -60px; }
  .secao { margin-top: 30px; }
  .acoes { grid-template-columns: repeat(3, 1fr); background: transparent; box-shadow: none; gap: 22px; overflow: visible; }
  .acao { background: var(--cartao); border-radius: 24px; box-shadow: var(--sombra); padding: 20px 22px; }
  .acao + .acao::before { display: none; }
  .acao.toque:active { transform: scale(.975); }
  .aviso { bottom: 120px; }
  dialog.folha { inset: 0; margin: auto; border-radius: 30px; height: fit-content; padding: 14px 28px 26px; }
  dialog.folha[open] { animation: surgir .45s var(--suave-ease); }
  dialog.folha.fechando { animation: fade .22s ease reverse forwards; }
  .alca { display: none; }
}
@media (max-width: 359px) {
  .duas { grid-template-columns: 1fr; }
}
</style>
</head>
<body class="anima">
<div class="pg">
  <header class="topo">
    <img class="logo" src="logo.svg" alt="AD Motos" width="132" height="41">
    <button class="redondo toque" type="button" data-id="compartilhar" aria-label="Compartilhar esta página">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12"/></svg>
    </button>
  </header>

  <main>
    <section class="hero" aria-labelledby="manchete">
      <p class="olho"><i aria-hidden="true"></i>Peças e acessórios</p>
      <h1 id="manchete"><span class="l">Tudo para</span><span class="l"><span class="grad">a sua moto</span><span class="ponto">.</span></span></h1>
      <p class="lead" id="lead"><b>Escolha com quem quer falar.</b></p>
    </section>

    <nav class="rapido" id="rapido" aria-label="Acesso rápido"></nav>

    <section class="alvo" id="lojas-sec" aria-labelledby="t-lojas">
      <div class="secao grande"><h2 id="t-lojas">Lojas Físicas</h2><span id="qtd-lojas"></span></div>
      <div class="lojas" id="lojas"></div>
    </section>

    <section class="alvo" id="atacado" aria-labelledby="t-atacado">
      <div class="secao grande"><h2 id="t-atacado">Atacado <span class="ext">(Matriz)</span></h2><span id="sub-atacado"></span></div>
      <div class="canais" id="canais-atacado"></div>
    </section>

    <div class="par">
      <section class="alvo" id="garantia" aria-labelledby="t-garantia">
        <div class="secao grande"><h2 id="t-garantia">Garantia</h2><span id="sub-garantia"></span></div>
        <div class="canais" id="canais-garantia"></div>
      </section>
      <section class="alvo" id="financeiro" aria-labelledby="t-financeiro">
        <div class="secao grande"><h2 id="t-financeiro">Financeiro</h2><span id="sub-financeiro"></span></div>
        <div class="canais" id="canais-financeiro"></div>
      </section>
    </div>

    <div class="secao grande"><h2>Mais formas de falar</h2></div>
    <div class="acoes" id="acoes"></div>
  </main>

  <footer class="rodape">
    <img src="favicon.svg" alt="" width="30" height="30">
    <span>AD Motos · <span id="cidades"></span></span>
  </footer>
</div>

<div class="barra">
  <button class="zap toque" type="button" data-id="abrir-escolha" aria-haspopup="dialog" aria-controls="escolha" id="abrir"></button>
</div>

<dialog class="folha" id="escolha" aria-labelledby="escolha-titulo">
  <div class="alca" aria-hidden="true"></div>
  <h2 id="escolha-titulo" tabindex="-1" autofocus>Com quem quer falar?</h2>
  <p class="sub">Fale pelo WhatsApp ou compre na loja online do atacado.</p>
  <div class="opcoes" id="opcoes"></div>
  <button class="cancelar toque" type="button" id="fechar">Cancelar</button>
</dialog>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="config.js?v=20261124e"></script>
<script src="links.js?v=20261124e"></script>
<script src="icones.js?v=20261124e"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const SVG = {
    copiar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>',
    contato: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>',
    compartilhar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12"/></svg>',
    loja: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v9.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V10"/><path d="M3 10 4.6 4.2A1.6 1.6 0 0 1 6.1 3h11.8a1.6 1.6 0 0 1 1.5 1.2L21 10a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0Z"/><path d="M10 21v-5h4v5"/></svg>',
    atacado: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 20 7v10l-8 4-8-4V7Z"/><path d="m4 7 8 4 8-4M12 11v10"/><path d="m8 5 8 4"/></svg>',
    garantia: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 19.5 6v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6Z"/><path d="m8.6 12 2.4 2.4 4.4-4.6"/></svg>',
    financeiro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
    desce: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  };
  const aneis = '<circle class="r3" cx="105" cy="105" r="100" stroke-width="1.5"/><circle class="r2" cx="105" cy="105" r="70" stroke-width="1.5"/><circle class="r1" cx="105" cy="105" r="40" stroke-width="1.5"/>';
  const radar = `<svg class="radar" viewBox="0 0 210 210" aria-hidden="true">${aneis}<circle class="halo" cx="105" cy="105" r="14"/><circle class="nucleo" cx="105" cy="105" r="6"/></svg>`;
  // Nos canais, os mesmos anéis com o ícone do assunto no centro (mesmo sistema visual das lojas).
  const radarIcone = svg => `<svg class="radar" viewBox="0 0 210 210" aria-hidden="true">${aneis}<g class="glifo" transform="translate(89 89) scale(1.333)">${(svg.match(/<svg[^>]*>([\s\S]*)<\/svg>/) || [, ""])[1]}</g></svg>`;
  const sufixo = nome => nome.split(/\s+/).pop().normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); // "varzea" / "bonfim"
  const idCopia = (loja, zap) => "copiar-" + (zap && zap.id.startsWith("zap-") ? zap.id.slice(4) : sufixo(loja.nome));
  const link = (k, cls, dentro, extra = "") => `<a class="${cls}" href="${esc(k.url)}" data-id="${esc(k.id)}"${alvo(k.url)}${extra}>${dentro}</a>`;

  const lojas = window.LOJAS || [], canais = window.CANAIS || [], outros = window.OUTROS || [];
  const GRUPOS = [
    { nome: "Atacado", extra: "(Matriz)", alvo: "atacado", icone: SVG.atacado },
    { nome: "Garantia", alvo: "garantia", icone: SVG.garantia },
    { nome: "Financeiro", alvo: "financeiro", icone: SVG.financeiro },
  ];
  const doGrupo = g => canais.filter(c => c.grupo === g);
  const extra = c => (c.titulo || "").split(" · ").slice(1).filter(x => x !== c.grupo); // ex.: "Matriz"
  const copiaId = c => "copiar-" + c.id.replace(/^zap-/, "");
  const listaCurta = arr => arr.length > 1 ? arr.slice(0, -1).join(", ") + " e " + arr[arr.length - 1] : (arr[0] || "");

  // Acesso rápido: 4 atalhos iguais (âncoras, sem data-id)
  const subGrupo = g => { const cs = doGrupo(g.nome); return cs.length > 1 ? listaCurta(cs.map(c => c.tipo === "site" ? "site" : c.curto)) : (cs[0] && cs[0].tipo === "zap" ? "WhatsApp" : ""); };
  const atalhos = [{ nome: "Lojas Físicas", alvo: "lojas-sec", icone: SVG.loja, sub: "Filiais" }]
    .concat(GRUPOS.filter(g => doGrupo(g.nome).length).map(g => ({ ...g, sub: subGrupo(g) })));
  $("#rapido").innerHTML = atalhos.map(a => `<a class="atalho toque" href="#${a.alvo}"><span class="ic">${a.icone}</span><span class="t"><b>${esc(a.nome)}${a.extra ? ` <span class="ext">${esc(a.extra)}</span>` : ""}</b><small>${esc(a.sub)}</small></span><span class="desce" aria-hidden="true">${SVG.desce}</span></a>`).join("");

  // Cartões dos canais (mesmo peso visual das lojas)
  GRUPOS.forEach(g => {
    const cs = doGrupo(g.nome), sec = document.getElementById(g.alvo);
    if (!cs.length) { sec.hidden = true; return; }
    document.getElementById("sub-" + g.alvo).textContent = cs.length > 1 ? listaCurta(cs.map(c => c.curto)) : "";
    document.getElementById("canais-" + g.alvo).innerHTML = cs.map(c => {
      const zap = c.tipo === "zap";
      const tags = [zap ? "WhatsApp" : "Site"].concat(extra(c));
      const botao = zap
        ? link(c, "zap toque", `<span class="bola">${ICO.zap}</span><span class="t"><b>Chamar no WhatsApp</b><small>${esc(c.sub)}</small></span>${SETA}`, ` aria-label="Chamar no WhatsApp: ${esc(c.curto)}, ${esc(c.sub)}"`)
        : link(c, "zap site toque", `<span class="bola">${ICO.site}</span><span class="t"><b>Abrir a loja online</b><small>${esc(c.sub)}</small></span>${SETA}`, ` aria-label="Abrir a loja online: ${esc(c.sub)}"`);
      return `<article class="loja canal" aria-label="${esc(c.titulo)}">
        ${radarIcone(zap ? g.icone : ICO.site)}
        <div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        <h3 class="cidade">${esc(c.curto)}</h3>
        <p class="end">${esc(c.desc)}</p>
        ${botao}
        ${zap && c.sub ? `<div class="uma"><button class="sec toque" type="button" data-id="${copiaId(c)}" data-copiar="${esc(c.sub)}" aria-label="Copiar número de ${esc(c.curto)}">${SVG.copiar}<span>Copiar número</span></button></div>` : ""}
      </article>`;
    }).join("");
  });

  // Cartões das lojas
  $("#lojas").innerHTML = lojas.map(l => {
    const z = l.links.find(k => k.tipo === "zap"), m = l.links.find(k => k.tipo === "mapa");
    return `<article class="loja" aria-label="Loja de ${esc(l.nome)}">
      ${radar}
      ${l.detalhe ? `<span class="tag">${esc(l.detalhe)}</span>` : ""}
      <h3 class="cidade">${esc(l.nome)}</h3>
      ${l.endereco ? `<p class="end">${ICO.pino}<span>${esc(l.endereco)}</span></p>` : ""}
      ${z ? link(z, "zap toque", `<span class="bola">${ICO.zap}</span><span class="t"><b>${esc(z.titulo)}</b><small>${esc(z.sub)}</small></span>${SETA}`,
        ` aria-label="${esc(z.titulo)}: ${esc(l.nome)}, ${esc(z.sub)}"`) : ""}
      <div class="duas">
        ${m ? link(m, "sec toque", `${ICO.mapa}<span>${esc(m.titulo)}</span>`, ` aria-label="${esc(m.titulo)}: ${esc(l.nome)}"`) : ""}
        ${z && z.sub ? `<button class="sec toque" type="button" data-id="${idCopia(l, z)}" data-copiar="${esc(z.sub)}" aria-label="Copiar número de ${esc(l.nome)}">${SVG.copiar}<span>Copiar número</span></button>` : ""}
      </div>
    </article>`;
  }).join("");

  $("#qtd-lojas").textContent = "Filiais";
  $("#cidades").textContent = listaCurta(lojas.map(l => l.nome)) + " · BA";

  // Ações gerais
  const ic = h => `<span class="ic">${h}</span>`;
  $("#acoes").innerHTML =
    `<a class="acao toque" href="admotos.vcf" data-id="salvar-contato" download>${ic(SVG.contato)}<span class="t"><b>Salvar contato</b><small>Todos os contatos na agenda</small></span>${SETA}</a>` +
    outros.map(k => link(k, "acao toque", `${ic(ICO[k.tipo] || ICO.site)}<span class="t"><b>${esc(k.titulo)}</b><small>${esc(k.sub || "")}</small></span>${SETA}`)).join("") +
    `<button class="acao toque" type="button" data-id="compartilhar">${ic(SVG.compartilhar)}<span class="t"><b>Compartilhar</b><small>Envie esta página</small></span>${SETA}</button>`;

  // Barra e folha de escolha
  $("#abrir").innerHTML = `${ICO.zap}<span>Falar no WhatsApp</span>`;
  const opcao = (k, nome, sub) => link(k, "opcao toque", `<span class="bola${k.tipo === "site" ? " site" : ""}">${k.tipo === "site" ? ICO.site : ICO.zap}</span><span class="t"><b>${esc(nome)}</b><small>${esc(sub)}</small></span>${SETA}`);
  // Na folha entram todos os canais (WhatsApp e a loja online). O grupo vai entre parênteses: "Loja online (Atacado)".
  const canaisZap = canais;
  const nomeCanal = c => c.grupo && c.grupo !== c.curto ? `${c.curto} (${c.grupo})` : c.curto;
  $("#opcoes").innerHTML =
    `<p class="grupo-folha">Lojas Físicas</p>` +
    lojas.map(l => { const z = l.links.find(k => k.tipo === "zap"); return z ? opcao(z, l.nome, z.sub) : ""; }).join("") +
    // Atacado (Televendas + Loja online) num grupo; os demais (Garantia, Financeiro) em "Outros".
    [["Atacado (Matriz)", canaisZap.filter(c => c.grupo === "Atacado")], ["Outros", canaisZap.filter(c => c.grupo !== "Atacado")]]
      .filter(([, cs]) => cs.length)
      .map(([titulo, cs]) => `<p class="grupo-folha">${esc(titulo)}</p>` +
        cs.map(c => opcao(c, nomeCanal(c), extra(c).concat(c.sub).filter(Boolean).join(" · "))).join("")).join("");

  const folha = $("#escolha"), corpo = document.body;
  const reduz = matchMedia("(prefers-reduced-motion: reduce)");
  function abrir() {
    if (folha.open) return;
    if (folha.showModal) folha.showModal(); else folha.setAttribute("open", "");
    const tit = document.getElementById("escolha-titulo"); if (tit) tit.focus({ preventScroll: true });
    corpo.classList.add("folha-aberta");
  }
  function fechar() {
    if (!folha.open || folha.classList.contains("fechando")) return;
    corpo.classList.remove("folha-aberta");
    const fim = () => { folha.classList.remove("fechando"); folha.close ? folha.close() : folha.removeAttribute("open"); };
    if (reduz.matches) return fim();
    folha.classList.add("fechando");
    setTimeout(fim, 260);
  }
  $("#abrir").addEventListener("click", abrir);
  $("#fechar").addEventListener("click", fechar);
  folha.addEventListener("cancel", e => { e.preventDefault(); fechar(); });
  folha.addEventListener("click", e => {
    if (e.target !== folha) return; // clique no fundo escurecido (fora do conteúdo)
    const r = folha.getBoundingClientRect();
    if (e.clientY < r.top || e.clientY > r.bottom || e.clientX < r.left || e.clientX > r.right) fechar();
  });
  $("#opcoes").addEventListener("click", e => { if (e.target.closest("a")) setTimeout(fechar, 350); });
  folha.addEventListener("close", () => corpo.classList.remove("folha-aberta"));

  // Arrastar para baixo fecha a janela (como nos aplicativos). Só começa se a lista estiver no topo.
  let y0 = 0, t0 = 0, dy = 0, arrastando = false, podeArrastar = false;
  const soltar = (transicao, transform, depois) => {
    folha.style.transition = transicao; folha.style.transform = transform;
    setTimeout(() => { folha.style.transition = ""; if (depois) depois(); }, 230);
  };
  folha.addEventListener("touchstart", e => {
    if (!folha.open || e.touches.length !== 1) return;
    podeArrastar = folha.scrollTop <= 0; arrastando = false; dy = 0;
    y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive: true });
  folha.addEventListener("touchmove", e => {
    if (!podeArrastar) return;
    dy = e.touches[0].clientY - y0;
    if (!arrastando && dy > 6 && folha.scrollTop <= 0) arrastando = true;
    if (!arrastando) { if (dy < 0) podeArrastar = false; return; }
    e.preventDefault();
    folha.style.transition = "none";
    folha.style.transform = `translateY(${Math.max(0, dy)}px)`;
  }, { passive: false });
  const fimArrasto = () => {
    if (!arrastando) return;
    arrastando = false; podeArrastar = false;
    const rapido = dy / Math.max(1, Date.now() - t0) > 0.6;
    if (dy > 110 || (dy > 40 && rapido)) {
      corpo.classList.remove("folha-aberta");
      soltar("transform .22s ease-in", "translateY(100%)", () => {
        folha.style.transform = ""; folha.close ? folha.close() : folha.removeAttribute("open");
      });
    } else {
      soltar("transform .25s cubic-bezier(.2,.8,.2,1)", "");
    }
  };
  folha.addEventListener("touchend", fimArrasto);
  folha.addEventListener("touchcancel", fimArrasto);

  // Aviso
  let tAviso;
  function avisar(txt) {
    const a = $("#aviso");
    a.innerHTML = SVG.ok + "<span>" + esc(txt) + "</span>";
    a.classList.add("ver");
    clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove("ver"), 2200);
  }
  async function copiar(txt) {
    try { await navigator.clipboard.writeText(txt); return true; } catch (e) {}
    try {
      const t = document.createElement("textarea");
      t.value = txt; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(t); t.select(); const ok = document.execCommand("copy"); t.remove(); return ok;
    } catch (e) { return false; }
  }

  document.addEventListener("click", async e => {
    const c = e.target.closest("[data-copiar]");
    if (c) { avisar((await copiar(c.dataset.copiar)) ? "Número copiado" : c.dataset.copiar); return; }
    const s = e.target.closest('button[data-id="compartilhar"]');
    if (s) {
      const url = location.href.split("#")[0];
      if (navigator.share) {
        try { await navigator.share({ title: "AD Motos", text: "Peças e acessórios para a sua moto. Fale com a AD Motos pelo WhatsApp:", url }); return; }
        catch (err) { if (err && err.name === "AbortError") return; }
      }
      avisar((await copiar(url)) ? "Link copiado" : "Não foi possível copiar");
    }
  });

  // Brilho que segue o dedo/mouse nos cartões
  document.addEventListener("pointermove", e => {
    const l = e.target.closest && e.target.closest(".loja"); if (!l) return;
    const r = l.getBoundingClientRect();
    l.style.setProperty("--mx", (e.clientX - r.left) + "px");
    l.style.setProperty("--my", (e.clientY - r.top) + "px");
  }, { passive: true });

  // Tira a classe de entrada depois que tudo apareceu (evita reanimar ao abrir/fechar a folha)
  setTimeout(() => corpo.classList.remove("anima"), 3600);
})();
</script>
