<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AD Motos</title>
<meta name="description" content="Encontre uma loja AD Motos em Várzea da Roça ou Senhor do Bonfim (BA). Peças e acessórios para a sua moto. Fale com a loja pelo WhatsApp.">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:title" content="AD Motos · Encontre uma loja">
<meta property="og:description" content="Peças e acessórios para a sua moto. Escolha a loja e fale com a gente pelo WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://helyanaraujo.github.io/admotos-links/og.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Localizador de lojas · estilo app de grande varejo:
   topo branco com o logo, mapa ilustrado em SVG com os dois pinos (vermelho só neles),
   rota azul ligando as lojas e cartões claros com o WhatsApp verde sempre à vista. */
:root {
  --azul: #002C8F; --azul-2: #1747C2; --azul-claro: #EAF0FC; --azul-borda: #C9D6F2; --azul-tinta: #061A4F;
  --vermelho: #E92525; --vermelho-2: #B8141A;
  --verde: #1FAF5A; --verde-2: #178E48;
  --fundo: #F4F6FA; --branco: #FFFFFF; --tinta: #0D1424; --suave: #586074; --linha: #E3E7EF;
  --terra: #EEF2F9; --terra-2: #E2E9F5; --rio: #CFDDF5;
  --sombra: 0 1px 2px rgba(13, 25, 60, .06), 0 6px 18px -6px rgba(13, 25, 60, .10);
  --sombra-alta: 0 2px 4px rgba(13, 25, 60, .06), 0 14px 32px -10px rgba(13, 25, 60, .22);
  --ease: cubic-bezier(.2, .8, .2, 1); --mola: cubic-bezier(.3, 1.4, .5, 1);
  --fonte: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --gx: max(16px, env(safe-area-inset-left, 0px)); --gxr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  background: var(--fundo); color: var(--tinta); font: 400 16px/1.45 var(--fonte);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a, button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--azul-2); outline-offset: 3px; }
svg { flex: none; }
.so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- topo branco ---------- */
.topo { background: var(--branco); border-bottom: 1px solid var(--linha); position: relative; }
.topo::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--azul); }
.topo-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 15px) var(--gxr) 12px var(--gx); }
.logo { display: block; width: 138px; height: auto; }
.topo-tag { font: 600 13px/1 var(--fonte); color: var(--azul); background: var(--azul-claro);
  padding: 8px 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.topo-tag svg { width: 14px; height: 14px; }

.pg { max-width: 1120px; margin: 0 auto; padding: 0 var(--gxr) 0 var(--gx); }

/* ---------- título ---------- */
.titulo { padding: 18px 0 12px; }
.titulo h1 { margin: 0; font: 800 26px/1.12 var(--fonte); letter-spacing: -.02em; color: var(--azul-tinta); }
.titulo p { margin: 6px 0 0; color: var(--suave); font-size: 15px; line-height: 1.4; }

/* ---------- mapa ---------- */
.mapa { position: relative; background: var(--terra); border-radius: 18px; overflow: hidden;
  box-shadow: var(--sombra); border: 1px solid var(--linha); aspect-ratio: 360 / 228; isolation: isolate; }
.mapa > svg.arte { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.rota-casca { stroke: #fff; stroke-width: 9; fill: none; stroke-linecap: round; }
.rota { stroke: var(--azul); stroke-width: 4.2; fill: none; stroke-linecap: round; }
.anim .rota, .anim .rota-casca { stroke-dasharray: 340; stroke-dashoffset: 0; animation: tracar 1.1s .15s var(--ease) backwards; }
@keyframes tracar { from { stroke-dashoffset: 340; } }

.selo { position: absolute; z-index: 3; font: 600 11.5px/1 var(--fonte); color: var(--suave);
  background: rgba(255, 255, 255, .92); border: 1px solid var(--linha); border-radius: 999px; padding: 6px 9px; }
.selo-qtd { top: 10px; left: 10px; color: var(--azul-tinta); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.selo-qtd i { width: 7px; height: 7px; border-radius: 50%; background: var(--vermelho); display: inline-block; }
.selo-aviso { bottom: 10px; left: 10px; font-weight: 500; font-size: 10.5px; padding: 5px 8px; }
.bussola { position: absolute; z-index: 3; bottom: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
  background: #fff; border: 1px solid var(--linha); display: grid; place-items: center; box-shadow: 0 1px 2px rgba(13,25,60,.08); }
.bussola svg { width: 22px; height: 22px; }

/* pinos (links de verdade, por cima do desenho) */
.pino { position: absolute; z-index: 4; width: 0; height: 0; }
.pino-alvo { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 0;
  transform: translate(-19px, -46px); border-radius: 14px; }
.pino-alvo:focus-visible { outline-offset: 2px; }
.gota { width: 38px; height: 48px; display: block; filter: drop-shadow(0 4px 5px rgba(120, 10, 10, .28));
  transform-origin: 50% 100%; transition: transform .25s var(--mola); }
.gota-num { font: 800 15px/1 var(--fonte); fill: var(--vermelho); }
.rotulo { background: #fff; border-radius: 10px; padding: 6px 10px 6px 9px; box-shadow: var(--sombra-alta);
  border: 1px solid var(--linha); white-space: nowrap; margin-top: -10px; transition: transform .25s var(--ease), border-color .2s; }
.rotulo b { display: block; font: 700 13px/1.15 var(--fonte); color: var(--tinta); }
.rotulo small { display: block; font: 600 11px/1.2 var(--fonte); color: var(--azul); margin-top: 1px; }
.pino.esq .pino-alvo { flex-direction: row-reverse; transform: translate(calc(-100% + 19px), -46px); }
.pino.dir .rotulo { margin-left: 4px; }
.pino.esq .rotulo { margin-right: 4px; }
.onda { position: absolute; left: -13px; top: -6px; width: 26px; height: 12px; border-radius: 50%;
  background: rgba(233, 37, 37, .28); pointer-events: none; }
.anim .onda { animation: onda 2.6s 1.4s ease-out infinite; }
@keyframes onda { 0% { transform: scale(.6); opacity: .9; } 70%, 100% { transform: scale(2.4); opacity: 0; } }
.anim .gota { animation: cair .6s var(--mola) backwards; }
.anim .pino:nth-of-type(2) .gota { animation-delay: .25s; }
@keyframes cair { from { transform: translateY(-18px) scale(.9); } }
.pino-alvo:hover .gota, .pino.quente .gota { transform: translateY(-4px) scale(1.06); }
.pino-alvo:hover .rotulo, .pino.quente .rotulo { border-color: var(--azul-borda); }
.pino-alvo:active .gota { transform: scale(.94); }

.dica { margin: 10px 2px 0; font-size: 13px; color: var(--suave); display: flex; align-items: center; gap: 6px; }
.dica svg { width: 15px; height: 15px; color: var(--azul); }

/* ---------- lista de lojas ---------- */
.lista-topo { scroll-margin-top: 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 22px 2px 10px; }
.lista-topo h2 { margin: 0; font: 800 20px/1.2 var(--fonte); letter-spacing: -.01em; color: var(--azul-tinta); }
.lista-topo span { font-size: 13px; color: var(--suave); }
.lojas { display: grid; gap: 12px; }

.loja { background: var(--branco); border-radius: 18px; border: 1px solid var(--linha); box-shadow: var(--sombra);
  padding: 14px; scroll-margin-top: 14px; position: relative; transition: box-shadow .3s, border-color .3s; }
.loja:focus { outline: none; }
.loja.destaque { border-color: var(--azul-borda); box-shadow: 0 0 0 3px rgba(23, 71, 194, .18), var(--sombra-alta); }
.anim .loja { animation: subir .55s var(--ease) backwards; }
.anim .loja:nth-child(1) { animation-delay: .35s; }
.anim .loja:nth-child(2) { animation-delay: .45s; }
@keyframes subir { from { transform: translateY(14px); } }

.loja-cab { display: flex; gap: 12px; align-items: flex-start; }
.marca-pino { width: 30px; height: 38px; margin-top: -1px; }
.loja-cab h3 { margin: 0; font: 800 19px/1.2 var(--fonte); letter-spacing: -.01em; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.tag { font: 700 11px/1 var(--fonte); letter-spacing: .04em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; }
.tag-matriz { background: var(--azul); color: #fff; }
.tag-filial { background: var(--azul-claro); color: var(--azul); }
.end { margin: 4px 0 0; color: var(--suave); font-size: 14px; display: flex; gap: 5px; align-items: flex-start; }
.end svg { margin-top: 2px; color: var(--suave); }

.btn-zap { margin-top: 13px; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 9px 14px 9px 12px;
  border-radius: 13px; background: var(--verde); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 6px 14px -6px rgba(23, 142, 72, .55);
  transition: transform .15s var(--ease), background .2s; }
.btn-zap:hover { background: var(--verde-2); }
.btn-zap:active { transform: scale(.985); }
.btn-zap .ic { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; }
.btn-zap .ic svg { width: 21px; height: 21px; }
.btn-zap .tx { flex: 1; min-width: 0; }
.btn-zap strong { display: block; font: 700 16px/1.2 var(--fonte); }
.btn-zap small { display: block; font: 600 14px/1.25 var(--fonte); opacity: .95; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.btn-zap .seta { opacity: .9; }

.acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.btn-sec { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 8px 10px;
  border-radius: 11px; border: 1px solid var(--azul-borda); background: #fff; color: var(--azul);
  font: 700 14px/1.15 var(--fonte); text-align: center; transition: background .2s, transform .15s var(--ease); }
.btn-sec:hover { background: var(--azul-claro); }
.btn-sec:active { transform: scale(.97); }
.btn-sec svg { width: 18px; height: 18px; }
.btn-sec.ok { background: var(--azul-claro); }

/* ---------- mais contatos ---------- */
.secao-t { margin: 26px 2px 10px; font: 800 17px/1.2 var(--fonte); color: var(--azul-tinta); }
.menu { background: #fff; border: 1px solid var(--linha); border-radius: 18px; box-shadow: var(--sombra); overflow: hidden; }
.item { display: flex; align-items: center; gap: 13px; width: 100%; min-height: 64px; padding: 11px 14px; text-align: left; transition: background .2s; }
.item + .item { border-top: 1px solid var(--linha); }
.item:hover { background: #F7F9FD; }
.item:active { background: var(--azul-claro); }
.item:focus-visible { outline-offset: -3px; }
.item .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--azul-claro); color: var(--azul); display: grid; place-items: center; }
.item .ic svg { width: 20px; height: 20px; }
.item .tx { flex: 1; min-width: 0; }
.item b { display: block; font: 700 15.5px/1.2 var(--fonte); }
.item small { display: block; color: var(--suave); font-size: 13.5px; line-height: 1.3; margin-top: 2px; overflow-wrap: anywhere; }
.item .seta { color: #9AA3B5; }

/* ---------- rodapé ---------- */
.rodape { margin: 28px 0 0; padding: 22px 0 calc(28px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--linha);
  display: flex; align-items: center; gap: 12px; color: var(--suave); font-size: 13px; line-height: 1.4; }
.rodape img { width: 34px; height: 34px; background: #fff; border-radius: 10px; padding: 5px; border: 1px solid var(--linha); }
.rodape b { color: var(--tinta); font-weight: 700; display: block; }

/* ---------- aviso ---------- */
.aviso { position: fixed; z-index: 20; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 140%); background: var(--azul-tinta); color: #fff; font: 600 14px/1.3 var(--fonte);
  padding: 11px 16px; border-radius: 12px; box-shadow: 0 12px 30px -8px rgba(6, 26, 79, .5);
  display: flex; align-items: center; gap: 8px; max-width: calc(100% - 32px); transition: transform .35s var(--ease), visibility 0s .35s; pointer-events: none; }
.aviso.ver { transition: transform .35s var(--ease), visibility 0s; }
.aviso svg { width: 18px; height: 18px; color: #7EE2A6; }
.aviso { visibility: hidden; }
.aviso.ver { transform: translate(-50%, 0); visibility: visible; }

/* ---------- computador ---------- */
@media (min-width: 960px) {
  .logo { width: 158px; }
  .corpo { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 36px; align-items: start; padding-top: 8px; }
  .col-mapa { position: sticky; top: 20px; }
  .titulo { padding: 26px 0 18px; }
  .titulo h1 { font-size: 34px; }
  .titulo p { font-size: 16px; }
  .lista-topo { margin-top: 34px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .viagem { display: none; }
}
</style>
</head>
<body>

<header class="topo">
  <div class="topo-in">
    <img class="logo" src="logo.svg" alt="AD Motos" width="158" height="49">
    <a class="topo-tag" href="#lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Lojas</a>
  </div>
</header>

<main class="pg">
  <div class="corpo">
    <div class="col-mapa">
      <section class="titulo">
        <h1>Encontre uma loja</h1>
        <p>Escolha a loja e fale com a gente no WhatsApp.</p>
      </section>

      <div class="mapa" id="mapa" role="group" aria-label="Mapa ilustrativo com as lojas AD Motos">
        <svg class="arte" viewBox="0 0 360 228" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
          <defs>
            <pattern id="grade" width="24" height="24" patternUnits="userSpaceOnUse">
              <path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1"/>
            </pattern>
            <radialGradient id="luz" cx="50%" cy="45%" r="70%">
              <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
              <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="360" height="228" fill="#EEF2F9"/>
          <!-- manchas de relevo -->
          <path d="M-10 40 C 40 10, 90 30, 110 70 S 60 140, 10 130 Z" fill="#E4EAF6"/>
          <path d="M250 -10 C 300 20, 380 10, 370 80 S 290 110, 260 70 Z" fill="#E4EAF6"/>
          <path d="M230 150 C 270 130, 340 150, 370 190 L 370 240 L 220 240 C 210 210, 200 170, 230 150 Z" fill="#E6ECF7"/>
          <path d="M-10 170 C 30 160, 70 190, 80 240 L -10 240 Z" fill="#E6ECF7"/>
          <rect width="360" height="228" fill="url(#grade)"/>
          <rect width="360" height="228" fill="url(#luz)"/>
          <!-- rio -->
          <path d="M-10 92 C 40 100, 70 80, 110 96 S 170 132, 220 120 S 300 100, 370 118" fill="none" stroke="#D3E0F6" stroke-width="5" stroke-linecap="round"/>
          <!-- estradas secundárias -->
          <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
            <path d="M-10 60 C 60 70, 110 50, 170 56" stroke-width="4"/>
            <path d="M178 58 C 230 66, 290 40, 370 48" stroke-width="3"/>
            <path d="M-10 196 C 60 186, 140 200, 204 190" stroke-width="4"/>
            <path d="M210 188 C 260 182, 320 200, 370 196" stroke-width="3"/>
            <path d="M96 -10 C 104 40, 84 90, 100 140 S 112 210, 104 240" stroke-width="3"/>
            <path d="M300 -10 C 292 50, 310 110, 296 160 S 286 220, 292 240" stroke-width="3"/>
          </g>
          <!-- rota principal entre as lojas -->
          <path id="rota" class="rota-casca" d="M205 186 C 232 160, 236 140, 210 124 S 148 104, 156 82 S 166 62, 160 54"/>
          <path class="rota" d="M205 186 C 232 160, 236 140, 210 124 S 148 104, 156 82 S 166 62, 160 54"/>
          <circle class="viagem" r="4.5" fill="#FFFFFF" stroke="#002C8F" stroke-width="2.4" visibility="hidden">
            <set attributeName="visibility" to="visible" begin="1.6s" fill="freeze"/>
            <animateMotion dur="3.4s" begin="1.6s;viagemfim.end+2.6s" id="viagemfim" fill="freeze" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".45 0 .25 1">
              <mpath href="#rota"/>
            </animateMotion>
          </circle>
        </svg>

        <span class="selo selo-qtd"><i aria-hidden="true"></i><span><span id="qtd-selo">2 lojas</span> na Bahia</span></span>
        <span class="bussola" aria-hidden="true">
          <svg viewBox="0 0 24 24"><text x="12" y="8.4" text-anchor="middle" font-family="Figtree, system-ui, sans-serif" font-weight="800" font-size="8.5" fill="#002C8F">N</text><path d="M12 10 15 17.5 12 16 9 17.5Z" fill="#002C8F"/></svg>
        </span>
        <span class="selo selo-aviso">Mapa ilustrativo, fora de escala</span>
        <div id="pinos"></div>
      </div>
      <p class="dica"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v3.5a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.6-2.2L4.6 14a1.5 1.5 0 0 1 2.3-1.9L9 14"/></svg>Toque no pino para ver a loja</p>
    </div>

    <div class="col-lista">
      <div class="lista-topo" id="lista">
        <h2 id="qtd-lojas">2 lojas</h2>
        <span>Várzea da Roça e Senhor do Bonfim</span>
      </div>
      <div class="lojas" id="lojas"></div>

      <h2 class="secao-t">Mais formas de contato</h2>
      <nav class="menu" id="menu" aria-label="Mais formas de contato"></nav>

      <footer class="rodape">
        <img src="favicon.svg" alt="" width="34" height="34">
        <div><b>AD Motos</b>Peças e acessórios para motos · Bahia</div>
      </footer>
    </div>
  </div>
</main>

<div class="aviso" id="aviso" role="status" aria-live="polite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span id="aviso-tx"></span></div>

<script src="config.js"></script>
<script src="links.js"></script>
<script src="icones.js"></script>
<script>
(function () {
  const reduz = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduz) document.documentElement.classList.add("anim");
  else document.querySelectorAll(".viagem").forEach(n => n.remove());

  const COPIAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>';
  const OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const CONTATO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M3 20a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg>';
  const COMPART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5"/><path d="M8 11H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-2"/></svg>';
  const gota = (n, cls) => '<svg class="' + cls + '" viewBox="0 0 38 48" aria-hidden="true"><path d="M19 47C19 47 3 30.5 3 18.5A16 16 0 0 1 35 18.5C35 30.5 19 47 19 47Z" fill="#E92525" stroke="#B8141A" stroke-width="1.2"/><circle cx="19" cy="18.5" r="10" fill="#fff"/><text class="gota-num" x="19" y="23.6" text-anchor="middle">' + n + '</text></svg>';

  // Posição no desenho (honesta e aproximada): Senhor do Bonfim fica ao norte de Várzea da Roça.
  const POS = { varzea: { x: 205, y: 186, lado: "esq" }, bonfim: { x: 160, y: 54, lado: "dir" } };
  const W = 360, H = 228;

  const LOJAS = window.LOJAS || [], OUTROS = window.OUTROS || [];
  const chave = l => { const z = l.links.find(k => k.tipo === "zap"); return z ? z.id.replace(/^zap-/, "") : l.nome.toLowerCase().replace(/\W+/g, "-"); };
  const qtd = LOJAS.length + (LOJAS.length === 1 ? " loja" : " lojas");
  document.getElementById("qtd-lojas").textContent = qtd;
  document.getElementById("qtd-selo").textContent = qtd;

  // ---- pinos ----
  const pinos = document.getElementById("pinos");
  pinos.innerHTML = LOJAS.map((l, i) => {
    const k = chave(l), p = POS[k] || { x: 60 + i * 120, y: 110, lado: "dir" };
    return '<div class="pino ' + p.lado + '" data-loja="' + esc(k) + '" style="left:' + (p.x / W * 100).toFixed(2) + '%;top:' + (p.y / H * 100).toFixed(2) + '%">' +
      '<span class="onda"></span>' +
      '<a class="pino-alvo" href="#loja-' + esc(k) + '" aria-label="Ver a loja de ' + esc(l.nome) + ' (' + esc(l.detalhe) + ')">' +
      gota(i + 1, "gota") + '<span class="rotulo" aria-hidden="true"><b>' + esc(l.nome) + '</b><small>' + esc(l.detalhe) + '</small></span></a></div>';
  }).join("");

  // ---- cartões das lojas ----
  document.getElementById("lojas").innerHTML = LOJAS.map((l, i) => {
    const k = chave(l);
    const zap = l.links.find(x => x.tipo === "zap");
    const mapa = l.links.find(x => x.tipo === "mapa");
    const tag = /matriz/i.test(l.detalhe) ? "tag-matriz" : "tag-filial";
    let h = '<article class="loja" id="loja-' + esc(k) + '" data-loja="' + esc(k) + '" tabindex="-1" aria-labelledby="t-' + esc(k) + '">' +
      '<div class="loja-cab">' + gota(i + 1, "marca-pino") +
      '<div><h3 id="t-' + esc(k) + '">' + esc(l.nome) + ' <span class="tag ' + tag + '">' + esc(l.detalhe) + '</span></h3>' +
      '<p class="end">' + ICO.pino + '<span>' + esc(l.endereco) + '</span></p></div></div>';
    if (zap) h += '<a class="btn-zap" href="' + esc(zap.url) + '" data-id="' + esc(zap.id) + '"' + alvo(zap.url) + '>' +
      '<span class="ic">' + ICO.zap + '</span><span class="tx"><strong>' + esc(zap.titulo) + '</strong><small>' + esc(zap.sub) + '</small></span>' + SETA + '</a>';
    h += '<div class="acoes">';
    if (mapa) h += '<a class="btn-sec" href="' + esc(mapa.url) + '" data-id="' + esc(mapa.id) + '"' + alvo(mapa.url) + '>' + ICO.mapa + '<span>' + esc(mapa.titulo) + '</span></a>';
    if (zap) h += '<button type="button" class="btn-sec copiar" data-id="copiar-' + esc(k) + '" data-num="' + esc(zap.sub) + '" aria-label="Copiar número de ' + esc(l.nome) + ': ' + esc(zap.sub) + '">' + COPIAR + '<span>Copiar número</span></button>';
    return h + '</div></article>';
  }).join("");

  // ---- mais contatos ----
  const linha = (tag, attrs, ic, t, s) => '<' + tag + ' class="item" ' + attrs + '><span class="ic">' + ic + '</span><span class="tx"><b>' + esc(t) + '</b>' + (s ? '<small>' + esc(s) + '</small>' : '') + '</span>' + SETA + '</' + tag.split(" ")[0] + '>';
  let menu = linha("a", 'href="admotos.vcf" data-id="salvar-contato" download', CONTATO, "Salvar contato", "Os dois WhatsApp na sua agenda");
  menu += OUTROS.map(o => linha("a", 'href="' + esc(o.url) + '" data-id="' + esc(o.id) + '"' + alvo(o.url), ICO[o.tipo] || ICO.site, o.titulo, o.sub)).join("");
  menu += linha("button", 'type="button" data-id="compartilhar" id="compartilhar"', COMPART, "Compartilhar", "Envie esta página para alguém");
  document.getElementById("menu").innerHTML = menu;

  // ---- aviso ----
  const aviso = document.getElementById("aviso"), avisoTx = document.getElementById("aviso-tx");
  let tAviso;
  function avisar(t) { avisoTx.textContent = t; aviso.classList.add("ver"); clearTimeout(tAviso); tAviso = setTimeout(() => aviso.classList.remove("ver"), 2400); }
  async function copiar(txt) {
    try { await navigator.clipboard.writeText(txt); return true; } catch (e) {}
    try {
      const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy"); ta.remove(); return ok;
    } catch (e) { return false; }
  }

  document.querySelectorAll(".copiar").forEach(b => b.addEventListener("click", async () => {
    const n = b.dataset.num;
    if (await copiar(n)) {
      avisar("Número copiado: " + n);
      const orig = b.innerHTML; b.classList.add("ok"); b.innerHTML = OK + "<span>Copiado</span>";
      setTimeout(() => { b.classList.remove("ok"); b.innerHTML = orig; }, 1800);
    } else avisar("Não deu para copiar. Número: " + n);
  }));

  document.getElementById("compartilhar").addEventListener("click", async () => {
    const url = location.href.split("#")[0];
    if (navigator.share) {
      try { await navigator.share({ title: "AD Motos", text: "Peças e acessórios para a sua moto. Fale com a AD Motos pelo WhatsApp:", url }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    avisar(await copiar(url) ? "Link copiado" : "Copie o endereço da página na barra do navegador");
  });

  // ---- pino → cartão (rolagem suave + destaque) ----
  function irPara(k) {
    const c = document.getElementById("loja-" + k); if (!c) return;
    c.scrollIntoView({ behavior: reduz ? "auto" : "smooth", block: "start" });
    try { c.focus({ preventScroll: true }); } catch (e) { c.focus(); }
    document.querySelectorAll(".loja.destaque").forEach(x => x.classList.remove("destaque"));
    c.classList.add("destaque"); clearTimeout(c._t); c._t = setTimeout(() => c.classList.remove("destaque"), 2200);
    if (history.replaceState) history.replaceState(null, "", "#loja-" + k);
  }
  pinos.addEventListener("click", ev => {
    const a = ev.target.closest(".pino-alvo"); if (!a) return;
    ev.preventDefault(); irPara(a.getAttribute("href").replace("#loja-", ""));
  });

  // cartão em foco/hover acende o pino correspondente
  const pinoDe = k => pinos.querySelector('.pino[data-loja="' + k + '"]');
  document.querySelectorAll(".loja").forEach(c => {
    const on = () => { const p = pinoDe(c.dataset.loja); if (p) p.classList.add("quente"); };
    const off = () => { const p = pinoDe(c.dataset.loja); if (p) p.classList.remove("quente"); };
    c.addEventListener("mouseenter", on); c.addEventListener("mouseleave", off);
    c.addEventListener("focusin", on); c.addEventListener("focusout", off);
  });
})();
</script>
<script src="rastreio.js"></script>
</body>
</html>
